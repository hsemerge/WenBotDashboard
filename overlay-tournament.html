<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournament Overlay</title>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,700;0,800;0,900;1,800;1,900&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ov-accent:#00e5ff;--ov-accent-rgb:0,229,255;--ov-panel:rgba(13,17,23,0.93);--ov-text:#ffffff;--ov-font:'Inter',sans-serif;--ov-font-heading:'Exo 2',sans-serif;}

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: transparent; font-family: var(--ov-font-heading); width: fit-content; }
    .overlay { padding: 0; }

    /* WenBot arena panel: glass + faint diagonal circuit lines + accent spine */
    .arena {
      position: relative;
      background:
        repeating-linear-gradient(115deg, rgba(var(--ov-accent-rgb),0.022) 0 2px, transparent 2px 26px),
        var(--ov-panel);
      border: 1px solid rgba(var(--ov-accent-rgb),0.22);
      border-radius: 16px;
      overflow: hidden;
      backdrop-filter: blur(12px);
      animation: fadeIn 0.4s ease;
      box-shadow: 0 0 34px rgba(var(--ov-accent-rgb),0.07);
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }

    .top-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding: 12px 18px 11px;
      border-bottom: 1px solid rgba(var(--ov-accent-rgb),0.18);
      background: linear-gradient(90deg, rgba(var(--ov-accent-rgb),0.08), transparent 45%, rgba(var(--ov-accent-rgb),0.05));
    }
    .t-title { display: flex; align-items: center; gap: 10px; }
    .t-bolt { width: 26px; height: 26px; border-radius: 7px; background: rgba(var(--ov-accent-rgb),0.14);
              border: 1px solid rgba(var(--ov-accent-rgb),0.45); display: flex; align-items: center; justify-content: center;
              font-size: 14px; }
    .battle-title { font-size: 15px; font-weight: 900; font-style: italic; color: var(--ov-text); letter-spacing: .03em; }
    .battle-sub   { font-family: var(--ov-font); font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.45); margin-top: 1px; text-transform: uppercase; letter-spacing: .08em; }
    .status-pill  { font-size: 10px; font-weight: 800; padding: 3px 10px; border-radius: 20px; letter-spacing: .05em; white-space: nowrap; }
    .pill-reg  { background: rgba(83,224,119,0.15); color: #53e077; border: 1px solid rgba(83,224,119,0.3); }
    .pill-live { background: rgba(255,71,87,0.15); color: #ff4757; border: 1px solid rgba(255,71,87,0.3); }
    .pill-done { background: rgba(255,215,0,0.12); color: #ffd700; border: 1px solid rgba(255,215,0,0.3); }

    .bigwin { display: flex; align-items: center; gap: 7px; background: rgba(255,215,0,0.09);
              border: 1px solid rgba(255,215,0,0.35); border-radius: 8px; padding: 4px 10px; white-space: nowrap;
              transform: skew(-8deg); }
    .bigwin > * { transform: skew(8deg); }
    .bigwin .bw1 { font-size: 8.5px; font-weight: 900; letter-spacing: .1em; color: rgba(255,215,0,0.65); }
    .bigwin .bw2 { font-size: 13px; font-weight: 900; color: #ffd700; font-family: var(--ov-font); }
    .bigwin .bw3 { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.6); font-family: var(--ov-font);
                   max-width: 120px; overflow: hidden; text-overflow: ellipsis; }

    /* ── CENTER-OUT ARENA BRACKET ──
       Sides converge on the Final in the middle: [R1-L]…[SF-L] [FINAL] [SF-R]…[R1-R] */
    .field { display: flex; gap: 12px; padding: 16px 18px 16px; align-items: stretch; }
    .bcol  { display: flex; flex-direction: column; width: 196px; flex: 0 0 auto; }
    .bcol.center { width: 220px; justify-content: center; }

    .rchip {
      align-self: center; margin-bottom: 12px;
      font-size: 9.5px; font-weight: 900; font-style: italic; letter-spacing: .14em;
      padding: 4px 14px; transform: skew(-12deg);
      background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.38);
      border: 1px solid rgba(255,255,255,0.07);
    }
    .rchip span { display: inline-block; transform: skew(12deg); }
    .rchip.now  { background: rgba(var(--ov-accent-rgb),0.15); color: var(--ov-accent); border-color: rgba(var(--ov-accent-rgb),0.5);
                  box-shadow: 0 0 12px rgba(var(--ov-accent-rgb),0.18); }
    .rchip.done { color: rgba(255,255,255,0.55); }

    .bcol-body { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 12px; }

    .bmatch {
      position: relative;
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px 12px 4px 12px; /* WenBot cut-corner signature */
      overflow: hidden;
    }
    .bmatch::before { /* accent notch, top-left */
      content: ''; position: absolute; top: 0; left: 0;
      border-style: solid; border-width: 9px 9px 0 0;
      border-color: rgba(var(--ov-accent-rgb),0.5) transparent transparent transparent;
    }
    .bmatch.hot { border-color: rgba(var(--ov-accent-rgb),0.6); animation: hotPulse 1.6s ease-in-out infinite; }
    @keyframes hotPulse { 0%,100% { box-shadow: 0 0 6px rgba(var(--ov-accent-rgb),0.12);} 50% { box-shadow: 0 0 18px rgba(var(--ov-accent-rgb),0.3);} }

    .bp { display: flex; align-items: center; gap: 7px; padding: 7px 10px; min-height: 33px; }
    .bp + .bp { border-top: 1px solid rgba(255,255,255,0.05); }
    .bp img { width: 20px; height: 20px; border-radius: 4px; object-fit: cover; flex: 0 0 auto; }
    .bp .nm { font-size: 12.5px; font-weight: 800; color: var(--ov-text);
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .xchip  { font-family: var(--ov-font); font-size: 10.5px; font-weight: 800; color: rgba(255,255,255,0.55);
              background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
              border-radius: 6px; padding: 1px 7px; flex: 0 0 auto; }
    .adv    { font-size: 10px; color: #31d76c; flex: 0 0 auto; }

    .bp.win  { background: linear-gradient(90deg, rgba(49,215,108,0.12), transparent 70%); }
    .bp.win .nm { color: #31d76c; }
    .bp.win .xchip { color: #31d76c; border-color: rgba(49,215,108,0.4); background: rgba(49,215,108,0.08); }
    .bp.lose .nm { color: rgba(255,71,87,0.7); }
    .bp.lose .xchip { color: rgba(255,71,87,0.55); border-color: rgba(255,71,87,0.2); }
    .bp.tbd .nm  { color: rgba(255,255,255,0.22); font-style: italic; font-weight: 600; }
    .bp.bye .nm  { color: rgba(255,255,255,0.2); font-style: italic; font-size: 11px; }

    /* Center column: crown + the Final */
    .crown {
      text-align: center; margin-bottom: 12px;
    }
    .crown .ring {
      width: 46px; height: 46px; margin: 0 auto 6px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 22px;
      background: radial-gradient(circle, rgba(255,215,0,0.16), rgba(255,215,0,0.03) 70%);
      border: 1px solid rgba(255,215,0,0.4);
    }
    .crown .lbl { font-size: 8.5px; font-weight: 900; letter-spacing: .2em; color: rgba(255,215,0,0.6); }
    .crown .who { font-size: 15px; font-weight: 900; font-style: italic; color: rgba(255,255,255,0.28); margin-top: 2px; }
    .crown.won .ring { animation: champGlow 1.6s ease-in-out infinite; }
    .crown.won .who  { color: #ffd700; }
    @keyframes champGlow { 0%,100% { box-shadow: 0 0 10px rgba(255,215,0,0.2);} 50% { box-shadow: 0 0 26px rgba(255,215,0,0.5);} }

    .bmatch.final { border-color: rgba(255,215,0,0.35); border-radius: 4px 14px 4px 14px; }
    .bmatch.final::before { border-top-color: rgba(255,215,0,0.55); }
    .bmatch.final .bp { min-height: 40px; }
    .bmatch.final .bp .nm { font-size: 14px; }

    .bottom-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 18px;
      border-top: 1px solid rgba(var(--ov-accent-rgb),0.15);
      background: rgba(0,0,0,0.2);
    }
    .info-label { font-family: var(--ov-font); font-size: 11px; color: rgba(255,255,255,0.4); }
    .info-label strong { color: rgba(255,255,255,0.75); }
    .pool-label { font-family: var(--ov-font); font-size: 11px; color: rgba(255,255,255,0.4); }
    .pool-label strong { color: #ffd700; }

    /* Registration list */
    .reg-wrap { width: 420px; }
    .reg-row { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .reg-row:last-child { border-bottom: none; }
    .reg-idx { font-size: 11px; color: rgba(255,255,255,0.35); min-width: 18px; }
    .reg-name { font-size: 14px; font-weight: 800; color: var(--ov-text); }

    .hidden { display: none; }
  </style>
  <script src="/js/overlay-theme.js"></script>
</head>
<body>
<div class="overlay" id="overlay">
  <div class="hidden" id="bracketCard"></div>
</div>

<script>
const _qs     = new URLSearchParams(window.location.search);
const channel = _qs.get('channel') || '';
// Two layouts, same WenBot design language:
//   arena   (default) — sides converge on a center Final under the crown
//   classic           — every round left-to-right, crown atop the last column
const LAYOUT  = _qs.get('layout') === 'classic' ? 'classic' : 'arena';

function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Round label by how many PLAYERS enter that round.
function roundLabel(round, size) {
  const players = size / Math.pow(2, round - 1);
  if (players <= 2)  return 'FINAL';
  if (players === 4) return 'SEMIS';
  if (players === 8) return 'QUARTERS';
  return 'ROUND OF ' + players;
}

async function poll() {
  if (!channel) return;
  try {
    const r = await fetch(`/api/tournament-state?channel=${encodeURIComponent(channel)}`);
    if (!r.ok) return;
    const { tournament } = await r.json();
    render(tournament);
  } catch {}
}

let _lastPayload = '';
function render(t) {
  // Re-render ONLY when the data changed — a full innerHTML rebuild every 2s
  // poll restarts the entry animation and reads as constant flicker.
  const sig = JSON.stringify(t || null);
  if (sig === _lastPayload) return;
  _lastPayload = sig;

  const card = document.getElementById('bracketCard');
  if (!t?.active) {
    // Standby shell — a dim placeholder so streamers can position/scale the
    // source in OBS before a tournament exists. ?standby=0 restores full hide.
    if (_qs.get('standby') === '0') { card.className = 'hidden'; return; }
    card.className = '';
    card.innerHTML = `<div style="display:inline-flex;align-items:center;gap:9px;background:var(--ov-panel);border:1px dashed rgba(255,255,255,0.28);border-radius:12px;padding:11px 18px;opacity:0.55;font-family:var(--ov-font-heading);color:var(--ov-text);font-size:13px;font-weight:800;">🏅 Tournament overlay <span style="font-family:var(--ov-font);font-weight:600;font-size:11px;color:rgba(255,255,255,0.55);">— standby · fills automatically when a tournament starts</span></div>`;
    return;
  }
  card.className = '';

  const statusPill = t.status === 'registration'
    ? '<div class="status-pill pill-reg">● REGISTRATION OPEN</div>'
    : t.status === 'active'
      ? '<div class="status-pill pill-live">● LIVE</div>'
      : '<div class="status-pill pill-done">🏆 COMPLETE</div>';

  const size = t.bracketSize || 8;
  const titleBlock = `
    <div class="t-title">
      <div class="t-bolt">⚡</div>
      <div><div class="battle-title">${escHtml(t.title || 'Tournament')}</div>
      <div class="battle-sub">${size}-player arena · highest multi advances</div></div>
    </div>`;

  // ── Registration ──
  if (t.status === 'registration') {
    let rows, enteredLabel;
    if (t.mode === 'raffle') {
      // Raffle-mode entries live in the ticket pool (tournament_entries), not
      // participants — show the pool counters + who joined last. When the
      // config is one-ticket-per-person, tickets == people, so one number.
      const tix   = t.entriesCount  || 0;
      const who   = Math.max(t.entrantsCount || 0, tix ? 1 : 0);
      const multi = (t.config && t.config.maxEntriesPerUser || 1) > 1;
      const stats = multi
        ? `<div><div style="font-size:24px;font-weight:900;color:var(--ov-accent);">🎟 ${tix.toLocaleString()}</div>
             <div style="font-family:var(--ov-font);font-size:9.5px;font-weight:800;letter-spacing:.1em;color:rgba(255,255,255,0.4);">TICKETS IN THE DRAW</div></div>
           <div><div style="font-size:24px;font-weight:900;color:var(--ov-text);">${who.toLocaleString()}</div>
             <div style="font-family:var(--ov-font);font-size:9.5px;font-weight:800;letter-spacing:.1em;color:rgba(255,255,255,0.4);">PLAYERS ENTERED</div></div>`
        : `<div><div style="font-size:24px;font-weight:900;color:var(--ov-accent);">🎟 ${tix.toLocaleString()}</div>
             <div style="font-family:var(--ov-font);font-size:9.5px;font-weight:800;letter-spacing:.1em;color:rgba(255,255,255,0.4);">PLAYERS ENTERED</div></div>`;
      rows = tix
        ? `<div style="padding:18px 16px;text-align:center;">
            <div style="display:flex;justify-content:center;gap:26px;">${stats}</div>
            ${t.lastEntrant ? `<div style="margin-top:12px;font-family:var(--ov-font);font-size:11.5px;color:rgba(255,255,255,0.55);">Latest entry: <strong style="color:#31d76c;">${escHtml(t.lastEntrant)}</strong> 🎉</div>` : ''}
            <div style="margin-top:8px;font-family:var(--ov-font);font-size:10px;color:rgba(255,255,255,0.35);">Bracket players are drawn from the entries when registration closes</div>
          </div>`
        : '<div style="padding:18px 16px;font-size:13px;color:rgba(255,255,255,0.35);text-align:center;">🎟 Entries are open — be the first in!</div>';
      enteredLabel = multi
        ? `<strong>${tix.toLocaleString()}</strong> ticket${tix === 1 ? '' : 's'} · <strong>${who.toLocaleString()}</strong> player${who === 1 ? '' : 's'}`
        : `<strong>${tix.toLocaleString()}</strong> entered`;
    } else {
      const participants = t.participants || [];
      rows = participants.length
        ? participants.slice(0, 8).map((p, i) =>
            `<div class="reg-row"><span class="reg-idx">#${i + 1}</span><span class="reg-name">${escHtml(p.kickUsername)}</span></div>`).join('')
          + (participants.length > 8 ? `<div style="padding:8px 16px;font-family:var(--ov-font);font-size:11px;color:rgba(255,255,255,0.4);">+${participants.length - 8} more…</div>` : '')
        : '<div style="padding:14px 16px;font-size:13px;color:rgba(255,255,255,0.35);text-align:center;">Waiting for participants…</div>';
      enteredLabel = `<strong>${participants.length}</strong> entered`;
    }
    card.innerHTML = `<div class="arena reg-wrap">
      <div class="top-bar">${titleBlock}${statusPill}</div>${rows}
      <div class="bottom-bar"><div class="info-label">${enteredLabel}</div>
      <div class="pool-label">Prize Pool: <strong>${(t.prizePool || 0).toLocaleString()} pts</strong></div></div></div>`;
    return;
  }

  // ── Active / complete: center-out arena bracket ──
  const totalRounds = Math.max(1, Math.round(Math.log2(size)));
  const rounds = t.rounds || [];
  const cur = t.currentRound || 1;

  // Biggest win so far — gold chip in the top bar.
  let bigX = 0, bigWho = null, bigSlot = '';
  rounds.forEach(rd => (rd.matches || []).forEach(m => ['p1', 'p2'].forEach(side => {
    const v = m.score && m.score[side] ? Number(m.score[side].x) || 0 : 0;
    if (v > bigX) { bigX = v; bigWho = m[side]; bigSlot = (m[side] && m[side].slot && m[side].slot.name) || ''; }
  })));
  const bigChip = bigX > 0
    ? `<div class="bigwin"><span class="bw1">💥 BIGGEST WIN</span><span class="bw2">${bigX.toFixed(2)}x</span><span class="bw3">${escHtml(bigSlot || (bigWho ? bigWho.kickUsername : ''))}</span></div>`
    : '';

  // dir: 'l' (advance →), 'r' (advance ←), 'c' (final)
  const playerRow = (p, cls, x, dir) => {
    const arrowL = dir === 'r' && cls === 'win' ? '<span class="adv">◀</span>' : '';
    const arrowR = dir === 'l' && cls === 'win' ? '<span class="adv">▶</span>' : '';
    return `<div class="bp ${cls}">
      ${arrowL}
      ${p && p.slot && p.slot.thumbnailUrl ? `<img src="${escHtml(p.slot.thumbnailUrl)}" alt="" onerror="this.style.display='none';">` : ''}
      <span class="nm">${p ? escHtml(p.kickUsername) : (cls === 'bye' ? 'BYE' : 'TBD')}</span>
      ${x ? `<span class="xchip">${x}</span>` : ''}
      ${arrowR}
    </div>`;
  };

  const matchCell = (m, r, dir, extraCls = '') => {
    if (!m) return `<div class="bmatch ${extraCls}">${playerRow(null, 'tbd', '', dir)}${playerRow(null, 'tbd', '', dir)}</div>`;
    const x1 = m.score && m.score.p1 ? (Number(m.score.p1.x) || 0).toFixed(2) + 'x' : '';
    const x2 = m.score && m.score.p2 ? (Number(m.score.p2.x) || 0).toFixed(2) + 'x' : '';
    const p1cls = !m.p1 ? 'bye' : m.winner === 'p1' ? 'win' : m.winner === 'p2' ? 'lose' : '';
    const p2cls = !m.p2 ? 'bye' : m.winner === 'p2' ? 'win' : m.winner === 'p1' ? 'lose' : '';
    const hot   = r === cur && t.status === 'active' && !m.winner && m.p1 && m.p2;
    return `<div class="bmatch ${extraCls} ${hot ? 'hot' : ''}">${playerRow(m.p1, p1cls, x1, dir)}${playerRow(m.p2, p2cls, x2, dir)}</div>`;
  };

  const chipCls = (r) => r === cur && t.status === 'active' ? 'now' : (r < cur || t.status === 'complete' ? 'done' : '');
  const col = (r, dir) => {
    const data  = rounds.find(x => x.round === r);
    const count = Math.max(1, size / Math.pow(2, r));
    const half  = count > 1 ? count / 2 : 1;
    const idx0  = dir === 'l' ? 0 : half;
    const cells = [];
    for (let i = 0; i < half; i++) {
      const m = data && data.matches && data.matches[idx0 + i];
      cells.push(matchCell(m, r, dir));
    }
    return `<div class="bcol"><div class="rchip ${chipCls(r)}"><span>${roundLabel(r, size)}</span></div>
      <div class="bcol-body">${cells.join('')}</div></div>`;
  };

  // Final match + champion crown (shared by both layouts).
  const finalData  = rounds.find(x => x.round === totalRounds);
  const finalMatch = finalData && finalData.matches && finalData.matches[0];
  let champName = null;
  if (finalMatch && finalMatch.winner) {
    const c = finalMatch.winner === 'p1' ? finalMatch.p1 : finalMatch.p2;
    if (c) champName = c.kickUsername;
  }
  const crownBlock = `<div class="crown ${champName ? 'won' : ''}">
      <div class="ring">👑</div>
      <div class="lbl">CHAMPION</div>
      <div class="who">${champName ? escHtml(champName) : 'TBD'}</div>
    </div>`;

  let field;
  if (LAYOUT === 'classic') {
    // Classic: every round as a full column, left → right, crown atop the Final.
    const colsC = [];
    for (let r = 1; r <= totalRounds; r++) {
      const data  = rounds.find(x => x.round === r);
      const count = Math.max(1, size / Math.pow(2, r));
      const cells = [];
      for (let i = 0; i < count; i++) {
        cells.push(matchCell(data && data.matches && data.matches[i], r, 'l', r === totalRounds ? 'final' : ''));
      }
      colsC.push(`<div class="bcol ${r === totalRounds ? 'center' : ''}">
        ${r === totalRounds ? crownBlock : ''}
        <div class="rchip ${chipCls(r)}"><span>${roundLabel(r, size)}</span></div>
        <div class="bcol-body">${cells.join('')}</div></div>`);
    }
    field = `<div class="field">${colsC.join('')}</div>`;
  } else {
    // Arena: sides converge on the center Final under the crown.
    const centerCol = `<div class="bcol center">
      ${crownBlock}
      <div class="rchip ${chipCls(totalRounds)}" style="align-self:center;"><span>${roundLabel(totalRounds, size)}</span></div>
      ${matchCell(finalMatch, totalRounds, 'c', 'final')}
    </div>`;
    const left  = [];
    const right = [];
    for (let r = 1; r < totalRounds; r++) {
      left.push(col(r, 'l'));
      right.unshift(col(r, 'r'));
    }
    field = totalRounds === 1
      ? `<div class="field">${centerCol}</div>`
      : `<div class="field">${left.join('')}${centerCol}${right.join('')}</div>`;
  }

  const alive = (t.participants || []).filter(p => !p.eliminated).length;
  card.innerHTML = `<div class="arena">
    <div class="top-bar">${titleBlock}<div style="display:flex;align-items:center;gap:10px;">${bigChip}${statusPill}</div></div>
    ${field}
    <div class="bottom-bar">
      <div class="info-label">Round <strong>${cur}</strong> of <strong>${totalRounds}</strong> &nbsp;·&nbsp; <strong>${alive || '—'}</strong> remaining</div>
      <div class="pool-label">Prize Pool: <strong>${(t.prizePool || 0).toLocaleString()} pts</strong></div>
    </div></div>`;
}

// Demo state for the Overlay Studio preview (?demo=1) — a mid-tournament
// 8-player arena so the full chrome is visible without a real one running.
const isDemo = new URLSearchParams(location.search).get('demo') === '1';
if (isDemo) {
  const P = (n) => ({ kickUsername: n });
  render({
    active: true,
    status: 'active',
    title: 'Friday Showdown',
    bracketSize: 8,
    currentRound: 2,
    prizePool: 12500,
    participants: [P('bigwinner99'), P('slot_hunter'), P('chipsking'), P('wenfan22')],
