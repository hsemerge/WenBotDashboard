<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TiltBros — Wager Race</title>
<meta name="description" content="TiltBros rewards hub — live Duelbits leaderboard, weekly wager raffles, giveaways and bounties.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  BESPOKE white-label portal for TiltBros (Agency tier).
  Self-contained page pulling the SAME live data as the standard portal via
  /api/portal-data?channel=thetiltbros — only the presentation is custom. Reached
  by tiltbros.com through SLUG_TO_PAGE in netlify/edge-functions/custom-domain.js.

  Content that isn't live data (raffle rules, bounty list, giveaway blurb) comes
  from PORTAL_PRESETS.thetiltbros.content in netlify/functions/portal-data.js — so
  copy changes are a preset edit, not a page edit.

  Design language: "tilt" — skewed section rules and a rotated lettermark, in
  signal green over near-black with a contour-line backdrop, matching the
  existing tiltbros.com aesthetic. Distinct from the purple SKSlots portal and
  Meg's; shared data layer, separate identity.

  The Bonuses view opens with a "support the code" panel whose browser mock-up
  is drawn entirely in CSS (see .bw-*) — no screenshot asset, so it stays crisp,
  recolours with the theme, and the cursor can animate.
-->
<style>
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --accent:#00e676; --accent2:#34d399; --gold:#ffd24a; --red:#ff3b47;
    --bg:#060a07; --bg-card:#0e150f; --border:#1d2a20;
    --text:#c3ccc6; --dim:#79877e; --bright:#ffffff;
    --accentGlow:rgba(0,230,118,.26);
    /* Accent tints derived from --accent so a theme swap carries everywhere.
       Previously these were hardcoded rgba() values, which meant recolouring
       the portal left orange smudges behind. */
    --accent-05:color-mix(in srgb, var(--accent) 5%, transparent);
    --accent-10:color-mix(in srgb, var(--accent) 10%, transparent);
    --accent-14:color-mix(in srgb, var(--accent) 14%, transparent);
    --red-05:color-mix(in srgb, var(--red) 6%, transparent);
    --red-14:color-mix(in srgb, var(--red) 14%, transparent);
    --red-30:color-mix(in srgb, var(--red) 30%, var(--border));
    /* The duotone: every rule, heading and mark runs green into red. Defined
       once so the pairing stays consistent instead of being re-typed per rule. */
    --duo:linear-gradient(90deg, var(--accent), var(--red));
  }
  html,body { height:100%; }
  body {
    font-family:'Inter',sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; overflow-x:hidden; position:relative;
  }
  /* Background: layered contour rings echoing the topographic texture on
     tiltbros.com, plus two drifting brand glows. Pure CSS repeating gradients —
     no image request, and it recolours with the theme. */
  .bg-grid {
    position:fixed; inset:-20%; z-index:0; pointer-events:none; opacity:.5;
    background-image:
      repeating-radial-gradient(circle at 18% 22%, transparent 0 26px, var(--border) 26px 27px, transparent 27px 54px),
      repeating-radial-gradient(circle at 82% 78%, transparent 0 30px, var(--border) 30px 31px, transparent 31px 62px);
    -webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 0%,transparent 78%);
    mask-image:radial-gradient(ellipse at 50% 30%,#000 0%,transparent 78%);
  }
  .glow { position:fixed; border-radius:50%; filter:blur(130px); opacity:.2; z-index:0; pointer-events:none; }
  .glow-1 { width:540px; height:540px; background:var(--accent);  top:-140px; left:-120px; animation:drift1 20s ease-in-out infinite; }
  .glow-2 { width:480px; height:480px; background:var(--accent2); bottom:-160px; right:-110px; animation:drift2 24s ease-in-out infinite; }
  /* A low red wash along the bottom edge — the same warm bleed the current
     tiltbros.com has under its contour texture. Deliberately faint: it should
     read as depth, not as a second brand colour. */
  .glow-3 { width:760px; height:340px; background:var(--red); bottom:-230px; left:50%; margin-left:-380px;
    opacity:.13; animation:drift3 26s ease-in-out infinite; }
  @keyframes drift1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(70px,50px)} }
  @keyframes drift2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-60px,-40px)} }
  @keyframes drift3 { 0%,100%{transform:translate(-30px,0)} 50%{transform:translate(30px,-18px)} }
  .wrap { position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:0 20px; }

  a { color:inherit; }
  .hidden { display:none !important; }

  /* NAV */
  nav { display:flex; align-items:center; justify-content:space-between; padding:20px 0; gap:16px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:12px; text-decoration:none; }
  .brand-mark {
    width:46px; height:46px; border-radius:13px; display:flex; align-items:center; justify-content:center;
    font-family:'Exo 2',sans-serif; font-weight:900; font-size:19px; color:#0a0a10;
    background:linear-gradient(135deg,var(--accent),var(--red)); transform:rotate(-8deg);
    box-shadow:0 0 26px var(--accentGlow); flex-shrink:0;
  }
  .brand-mark span { transform:rotate(8deg); }
  .brand img { width:46px; height:46px; border-radius:13px; object-fit:cover; }
  .brand-name { font-family:'Exo 2',sans-serif; font-weight:900; font-size:22px; color:var(--bright); letter-spacing:.04em; }
  .brand-sub { font-size:11px; color:var(--dim); }
  .nav-links { display:flex; gap:6px; flex-wrap:wrap; }
  .nav-links a {
    color:var(--dim); text-decoration:none; font-weight:700; font-size:12.5px; letter-spacing:.03em;
    padding:8px 13px; border-radius:9px; border:1px solid transparent; transition:.15s; cursor:pointer; text-transform:uppercase;
  }
  .nav-links a:hover { color:var(--bright); background:rgba(255,255,255,.04); }
  .nav-links a.on { color:var(--bright); border-color:var(--accent); background:var(--accent-10); }

  /* LINK BAR */
  .linkbar { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center;
    margin:6px 0 26px; background:rgba(255,255,255,.02); border:1px solid var(--border); border-radius:14px; padding:12px 16px; }
  .linkbar a { display:inline-flex; align-items:center; gap:7px; padding:8px 15px; border-radius:10px;
    color:var(--text); text-decoration:none; font-size:13px; font-weight:600; border:1px solid var(--border);
    background:rgba(255,255,255,.02); transition:.15s; white-space:nowrap; }
  .linkbar a:hover { border-color:var(--accent); background:var(--accent-10); color:var(--bright); transform:translateY(-1px); }

  /* HERO */
  .hero { text-align:center; padding:14px 0 10px; }
  .hero .kicker { display:inline-block; font-size:11px; font-weight:800; letter-spacing:.18em; text-transform:uppercase;
    color:var(--red); border:1px solid var(--red-30); background:var(--red-05);
    border-radius:30px; padding:5px 15px; transform:skewX(-8deg); }
  .hero .kicker span { display:inline-block; transform:skewX(8deg); }
  /* Headline runs green→red. Gold left the headline on purpose — it now says
     "money" and nothing else, so the prize figure below is the one thing on the
     page wearing it. */
  .hero h1 { font-family:'Exo 2',sans-serif; font-weight:900; font-size:clamp(30px,5.4vw,60px); line-height:1.04; margin-top:14px;
    background:var(--duo); -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; letter-spacing:.02em; }
  .hero .prize { font-family:'Exo 2',sans-serif; font-weight:900; font-size:clamp(40px,7vw,74px);
    color:var(--gold); text-shadow:0 0 34px rgba(255,201,60,.4); margin:4px 0 2px; }
  .hero .prize-sub { font-size:12.5px; color:var(--dim); letter-spacing:.04em; }
  .hero .tagline { color:var(--dim); font-size:14px; margin-top:12px; }
  .cta { display:inline-block; margin-top:16px; padding:13px 30px; border-radius:12px; font-weight:800; font-size:14.5px;
    color:#120800; text-decoration:none; background:linear-gradient(90deg,var(--accent),var(--gold));
    box-shadow:0 0 30px var(--accentGlow); transition:.15s; }
  .cta:hover { transform:translateY(-2px); box-shadow:0 0 40px var(--accentGlow); }

  /* COUNTDOWN */
  .countdown { display:flex; gap:12px; justify-content:center; margin:28px 0 6px; flex-wrap:wrap; }
  .cd-cell { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:13px 19px; min-width:82px; text-align:center; }
  .cd-num { font-family:'Exo 2',sans-serif; font-weight:900; font-size:36px; color:var(--accent2); transition:color .3s; }
  .cd-lab { font-size:9.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.13em; margin-top:3px; }
  /* Final 48 hours: the whole countdown flips red and breathes. Functional
     urgency — it tells a player the race is closing, rather than decorating. */
  .countdown.urgent .cd-cell { border-color:color-mix(in srgb, var(--red) 45%, var(--border)); }
  .countdown.urgent .cd-num { color:var(--red); }
  .countdown.urgent { animation:urgentPulse 2.4s ease-in-out infinite; }
  @keyframes urgentPulse { 0%,100%{filter:none} 50%{filter:drop-shadow(0 0 14px color-mix(in srgb, var(--red) 40%, transparent))} }
  .cd-ends { text-align:center; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--red); font-weight:800; margin-top:10px; display:none; }
  .countdown.urgent + .cd-ends { display:block; }

  /* SECTION HEADINGS — the "tilt" motif */
  .sec { margin:44px 0 0; }
  .sec-head { display:flex; align-items:center; gap:14px; margin-bottom:18px; }
  .sec-head h2 { font-family:'Exo 2',sans-serif; font-weight:900; font-size:clamp(20px,2.6vw,27px); color:var(--bright);
    letter-spacing:.03em; white-space:nowrap; }
  /* Every section rule runs the duotone — green at the heading, red as it
     travels out. It's the repeated element that makes the pairing read as a
     system rather than two colours that happen to be present. */
  .sec-head .rule { flex:1; height:2px; transform:skewX(-24deg);
    background:linear-gradient(90deg,var(--accent) 0%,var(--red) 62%,transparent 100%); }
  .sec-sub { color:var(--dim); font-size:13.5px; margin:-8px 0 20px; line-height:1.65; max-width:760px; }

  /* PODIUM */
  .podium { display:flex; justify-content:center; align-items:flex-end; gap:16px; margin:8px 0 18px; flex-wrap:wrap; }
  .pod { width:206px; background:linear-gradient(180deg,rgba(255,255,255,.045),var(--bg-card)); border:1px solid var(--border);
    border-radius:18px; padding:26px 16px 18px; text-align:center; position:relative; }
  .pod.rank-1 { border-color:var(--gold); box-shadow:0 0 40px rgba(255,201,60,.24); transform:translateY(-24px); width:230px; padding-top:32px; }
  .pod.rank-2 { border-color:#c9d3e6; box-shadow:0 0 20px rgba(201,211,230,.1); }
  .pod.rank-3 { border-color:#d8995a; box-shadow:0 0 20px rgba(216,153,90,.1); }
  .pod .crown { font-size:28px; line-height:1; }
  .pod.rank-1 .crown { font-size:36px; filter:drop-shadow(0 0 10px rgba(255,201,60,.6)); }
  .pod .av-wrap { position:relative; width:74px; height:74px; margin:8px auto 12px; }
  .pod.rank-1 .av-wrap { width:92px; height:92px; }
  .pod .av { width:100%; height:100%; border-radius:50%; background:var(--accent-10); border:3px solid var(--accent2);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:21px; color:var(--accent2); overflow:hidden; }
  .pod .av img { width:100%; height:100%; object-fit:cover; }
  .pod.rank-1 .av { border-color:var(--gold); }
  .pod.rank-2 .av { border-color:#c9d3e6; }
  .pod.rank-3 .av { border-color:#d8995a; }
  .pod .badge { position:absolute; bottom:-4px; left:50%; transform:translateX(-50%); min-width:24px; height:24px; padding:0 6px;
    border-radius:12px; font-family:'Exo 2',sans-serif; font-weight:900; font-size:13px; color:#0b0b12;
    display:flex; align-items:center; justify-content:center; border:2px solid var(--bg); }
  .pod.rank-1 .badge { background:var(--gold); } .pod.rank-2 .badge { background:#c9d3e6; } .pod.rank-3 .badge { background:#d8995a; }
  .pod .nm { font-family:'Exo 2',sans-serif; font-weight:800; color:var(--bright); font-size:16.5px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:11px; }
  .pod .wg-box { background:rgba(0,0,0,.3); border:1px solid var(--border); border-radius:10px; padding:9px 8px; margin-bottom:8px; }
  .pod .wg-lab { font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); font-weight:700; }
  .pod .wg { font-family:'Exo 2',sans-serif; font-weight:900; color:var(--accent2); font-size:17px; margin-top:2px; }
  .pod .pz { font-family:'Exo 2',sans-serif; font-weight:900; color:var(--gold); font-size:17px; }

  /* TABLE */
  .tbl-wrap { background:var(--bg-card); border:1px solid var(--border); border-radius:16px; overflow:hidden; }
  table { width:100%; border-collapse:collapse; }
  .tbl-wrap { position:relative; }
  .tbl-wrap::before { content:''; position:absolute; inset:0 0 auto 0; height:2px; background:var(--duo); z-index:1; }
  th { text-align:left; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim);
    padding:13px 16px; border-bottom:1px solid var(--border); font-weight:700; }
  td { padding:13px 16px; border-bottom:1px solid rgba(36,42,61,.55); font-size:14px; }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:rgba(255,255,255,.02); }
  .rk { font-family:'Exo 2',sans-serif; font-weight:900; color:var(--dim); width:56px; }
  .nm-cell { color:var(--bright); font-weight:600; }
  .wg-cell { color:var(--accent2); font-weight:700; font-variant-numeric:tabular-nums; text-align:right; }
  .pz-cell { color:var(--gold); font-weight:800; text-align:right; width:110px; }
  .empty { text-align:center; color:var(--dim); padding:34px 16px; font-size:13.5px; }

  /* CARDS / GRIDS */
  .grid { display:grid; gap:14px; }
  .g3 { grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); }
  .g4 { grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); }
  .card { background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:20px; }
  .card h3 { font-family:'Exo 2',sans-serif; font-weight:800; color:var(--bright); font-size:16px; margin-bottom:8px; }
  .card p { font-size:13.5px; color:var(--dim); line-height:1.65; }
  .card .ico { font-size:26px; margin-bottom:10px; display:block; }
  .card ul { margin:8px 0 0 18px; }
  .card li { font-size:13px; color:var(--dim); line-height:1.75; }

  /* STAT TILES */
  /* Stat tiles alternate the wash green / red across a row, so a strip of them
     carries the duotone instead of reading as a block of one colour. */
  .stat { background:linear-gradient(180deg,var(--accent-05),var(--bg-card)); border:1px solid var(--border);
    border-radius:16px; padding:20px 18px; text-align:center; position:relative; overflow:hidden; }
  .stat::before { content:''; position:absolute; inset:0 0 auto 0; height:2px; background:var(--accent); opacity:.55; }
  .stat:nth-child(even) { background:linear-gradient(180deg,var(--red-05),var(--bg-card)); }
  .stat:nth-child(even)::before { background:var(--red); }
  .stat .v { font-family:'Exo 2',sans-serif; font-weight:900; font-size:30px; color:var(--gold); line-height:1.1; }
  .stat .l { font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); margin-top:6px; font-weight:700; }

  /* WINNER ROWS */
  .win-row { display:flex; align-items:center; gap:12px; padding:11px 15px; background:var(--bg-card);
    border:1px solid var(--border); border-radius:11px; }
  .win-row .w-av { width:32px; height:32px; border-radius:50%; background:var(--accent-14); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex-shrink:0; }
  .win-row .w-nm { flex:1; color:var(--bright); font-weight:700; font-size:13.5px; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .win-row .w-what { color:var(--dim); font-size:12px; }
  .win-row .w-when { color:var(--dim); font-size:11px; white-space:nowrap; }

  /* TIER TABLE */
  .tier-row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 16px;
    border-bottom:1px solid rgba(36,42,61,.55); }
  .tier-row:last-child { border-bottom:none; }
  .tier-row .tw { font-family:'Exo 2',sans-serif; font-weight:800; color:var(--bright); font-size:14.5px; }
  .tier-row .tr { color:var(--gold); font-weight:800; font-size:14px; text-align:right; }

  /* STEPS */
  /* BOUNTY CARDS — the one section that owns red. A hairline top edge and a
     red icon glow, so bounties read as the aggressive thing on the site
     without recolouring the card itself. */
  .card.bounty { border-color:color-mix(in srgb, var(--red) 30%, var(--border)); position:relative; overflow:hidden; }
  .card.bounty::before { content:''; position:absolute; inset:0 0 auto 0; height:2px;
    background:linear-gradient(90deg,var(--red),transparent); }
  .card.bounty .ico { filter:drop-shadow(0 0 12px color-mix(in srgb, var(--red) 55%, transparent)); }
  .card.bounty h3 { color:var(--red); }
  .bounty-rule { background:linear-gradient(90deg,var(--red),transparent) !important; }

  .step { position:relative; }
  .step .n { position:absolute; top:-9px; right:14px; font-family:'Exo 2',sans-serif; font-weight:900;
    font-size:40px; color:var(--accent-14); line-height:1; }
  /* Step 1 green, step 2 red, step 3 green — the sequence walks the duotone. */
  .step:nth-child(even) .n { color:var(--red-14); }
  .step:nth-child(even) { border-color:var(--red-30); }

  /* ── "SUPPORT THE CODE" PROMO PANEL ─────────────────────────────────────
     Left: the offer. Right: a browser window drawn in CSS showing the sign-up
     form with the referral code pre-filled, and a cursor that loops in and
     clicks Register. No screenshot — stays sharp at any DPI and recolours with
     the theme. */
  /* ── CENTERED PAGE HEADER ───────────────────────────────────────────────
     The shared treatment for every view: small green kicker, big italic
     duotone headline, optional live pill, then the blurb. Using one component
     everywhere is what makes the sections feel like one site. */
  .page-head { text-align:center; margin-bottom:26px; }
  .page-kicker { font-size:11px; font-weight:800; letter-spacing:.24em; text-transform:uppercase; color:var(--accent); }
  .page-head h2 { font-family:'Exo 2',sans-serif; font-weight:900; font-style:italic; text-transform:uppercase;
    font-size:clamp(28px,5vw,52px); letter-spacing:.01em; margin:8px 0 10px;
    background:var(--duo); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .page-head p { color:var(--dim); font-size:14px; max-width:640px; margin:0 auto; line-height:1.7; }
  .page-head p b { color:var(--bright); font-weight:700; }
  .page-head p .hl { color:var(--accent); font-weight:800; }

  /* Live pill — red, with a pulsing dot. Signals "this happens on stream". */
  .live-pill { display:inline-flex; align-items:center; gap:9px; margin:6px 0 14px; padding:8px 20px;
    border-radius:30px; border:1px solid var(--red); background:var(--red-05);
    font-size:11.5px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--red); }
  .live-pill .dot { width:7px; height:7px; border-radius:50%; background:var(--red); animation:livePulse 1.8s ease-in-out infinite; }
  @keyframes livePulse { 0%,100%{opacity:1;box-shadow:0 0 0 0 var(--red)} 50%{opacity:.55;box-shadow:0 0 0 5px transparent} }

  /* Feature prize card — "this week's prize" style hero for a single headline
     reward, sitting above the supporting detail. */
  .prize-hero { text-align:center; border:1px solid var(--red-30); border-radius:18px; padding:30px 24px;
    background:linear-gradient(180deg,var(--red-05),var(--bg-card)); margin-bottom:26px; }
  .prize-hero .ph-lab { font-size:11px; font-weight:800; letter-spacing:.2em; text-transform:uppercase; color:var(--red); }
  .prize-hero .ph-val { font-family:'Exo 2',sans-serif; font-weight:900; font-style:italic;
    font-size:clamp(28px,5vw,46px); color:var(--bright); margin:10px 0 8px; }
  .prize-hero .ph-txt { color:var(--dim); font-size:13.5px; line-height:1.7; max-width:520px; margin:0 auto; }

  .promo { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.25fr); gap:34px; align-items:center;
    background:linear-gradient(135deg,var(--accent-05),var(--bg-card) 55%,var(--red-05));
    border:1px solid var(--border); border-radius:20px; padding:34px;
    position:relative; overflow:hidden; }
  .promo::before { content:''; position:absolute; inset:0 0 auto 0; height:2px; background:var(--duo); }
  .promo-pill { display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent); border:1px solid var(--accent); border-radius:30px; padding:5px 14px; }
  .promo h3 { font-family:'Exo 2',sans-serif; font-weight:900; font-style:italic; font-size:clamp(22px,3.2vw,34px);
    color:var(--bright); margin:14px 0 10px; }
  .promo .p-text { color:var(--dim); font-size:13.5px; line-height:1.7; max-width:420px; }
  .promo .offer { margin-top:20px; border:1px solid var(--accent); border-radius:12px; padding:13px 18px; background:var(--accent-05); }
  .promo .offer .o-lab { font-size:9.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
  .promo .offer .o-val { font-family:'Exo 2',sans-serif; font-weight:900; font-style:italic; text-transform:uppercase;
    color:var(--accent); font-size:18px; margin-top:3px; }
  .promo .code-chip { display:inline-flex; align-items:center; gap:9px; margin-top:14px; padding:10px 16px;
    background:rgba(255,255,255,.03); border:1px solid var(--border); border-radius:10px; font-size:12px;
    letter-spacing:.1em; text-transform:uppercase; color:var(--dim); font-weight:700; }
  .promo .code-chip b { font-family:'Exo 2',sans-serif; font-style:italic; color:var(--accent); letter-spacing:.06em; font-size:14px; }
  .promo .p-cta { display:inline-block; margin-top:18px; padding:14px 30px; border-radius:10px; font-weight:800;
    font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:#04150b; text-decoration:none;
    background:var(--accent); box-shadow:0 0 28px var(--accentGlow); transition:.15s; }
  .promo .p-cta:hover { transform:translateY(-2px); filter:brightness(1.08); }
  .promo .p-how { display:block; margin-top:14px; font-size:12.5px; color:var(--dim); text-decoration:underline; }
  .promo .p-how:hover { color:var(--bright); }

  /* Browser chrome */
  .bw { background:#0b0f0c; border:1px solid var(--border); border-radius:14px; overflow:hidden;
    box-shadow:0 26px 60px rgba(0,0,0,.55); }
  .bw-bar { display:flex; align-items:center; gap:8px; padding:11px 14px; background:rgba(255,255,255,.03);
    border-bottom:1px solid var(--border); }
  .bw-dot { width:9px; height:9px; border-radius:50%; background:#2c3a30; flex-shrink:0; }
  .bw-url { flex:1; margin-left:6px; background:rgba(0,0,0,.4); border:1px solid var(--border); border-radius:7px;
    padding:5px 12px; font-size:11.5px; color:var(--text); }
  .bw-body { display:grid; grid-template-columns:1fr 1fr; min-height:290px; }
  /* Artwork panel — gradient placeholder until promoImage is supplied. */
  .bw-art { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; padding:22px 16px; text-align:center;
    background:radial-gradient(circle at 50% 30%, var(--accent-14), transparent 70%), #0a120d;
    border-right:1px solid var(--border); }
  .bw-art img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .bw-art .a-mark { font-family:'Exo 2',sans-serif; font-weight:900; font-size:20px; color:var(--bright); letter-spacing:.06em; }
  .bw-art .a-sub { font-size:11px; color:var(--dim); letter-spacing:.06em; }
  /* Fake sign-up form */
  .bw-form { padding:18px 18px 22px; position:relative; }
  .bw-tabs { display:flex; gap:18px; border-bottom:1px solid var(--border); padding-bottom:9px; margin-bottom:14px; }
  .bw-tabs span { font-size:11.5px; font-weight:700; color:var(--dim); }
  .bw-tabs span.on { color:var(--accent); border-bottom:2px solid var(--accent); padding-bottom:9px; margin-bottom:-11px; }
  .bw-f { margin-bottom:11px; }
  .bw-f label { display:block; font-size:9.5px; color:var(--dim); margin-bottom:4px; letter-spacing:.04em; }
  .bw-f .inp { background:rgba(0,0,0,.45); border:1px solid var(--border); border-radius:7px; padding:8px 11px;
    font-size:12px; color:var(--text); }
  .bw-f .inp.code { border-color:var(--accent); color:var(--accent); font-weight:700; letter-spacing:.06em; }
  .bw-btn { margin-top:14px; text-align:center; background:var(--accent); color:#04150b; border-radius:8px;
    padding:10px; font-size:12.5px; font-weight:800; position:relative; }
  /* Click feedback — the button dips exactly when the cursor lands. */
  .bw-btn { animation:btnPress 5s ease-in-out infinite; }
  @keyframes btnPress {
    0%,54% { transform:scale(1);    filter:brightness(1); }
    58%    { transform:scale(.965); filter:brightness(.88); }
    64%    { transform:scale(1);    filter:brightness(1); }
    100%   { transform:scale(1); }
  }
  /* Ripple out of the button on the same beat. */
  .bw-btn::after { content:''; position:absolute; left:50%; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px;
    border-radius:50%; border:2px solid #04150b; opacity:0; animation:btnRipple 5s ease-out infinite; }
  @keyframes btnRipple {
    0%,54% { transform:scale(.4); opacity:0; }
    58%    { transform:scale(.6); opacity:.55; }
    72%    { transform:scale(3.4); opacity:0; }
    100%   { transform:scale(3.4); opacity:0; }
  }
  /* Screenshot mode: the supplied sign-up image fills the window body, with the
     cursor absolutely placed over its Register button. Percentages (not pixels)
     so it stays on target as the panel scales. */
  .bw-shot { position:relative; line-height:0; }
  .bw-shot img { width:100%; height:auto; display:block; }
  .bw-shot .bw-cursor { right:auto; bottom:auto; left:74%; top:73%; }
  /* The click ring pulses on the button underneath the cursor. */
  .bw-shot .tap { position:absolute; left:74%; top:73%; width:16px; height:16px; margin:-6px 0 0 -6px;
    border-radius:50%; border:2px solid #fff; opacity:0; pointer-events:none;
    animation:btnRipple 5s ease-out infinite; }

  .bw-cursor { position:absolute; right:26px; bottom:16px; width:19px; height:19px; pointer-events:none;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.6)); animation:curMove 5s ease-in-out infinite; }
  @keyframes curMove {
    0%    { transform:translate(34px,46px) scale(1); opacity:0; }
    12%   { opacity:1; }
    50%   { transform:translate(0,0) scale(1); opacity:1; }
    58%   { transform:translate(0,0) scale(.86); }
    66%   { transform:translate(0,0) scale(1); }
    88%   { transform:translate(0,0) scale(1); opacity:1; }
    100%  { transform:translate(34px,46px) scale(1); opacity:0; }
  }
  @media (prefers-reduced-motion:reduce) {
    .bw-btn, .bw-btn::after, .bw-cursor, .glow { animation:none; }
    .bw-cursor { opacity:1; transform:none; }
  }
  @media (max-width:900px) {
    .promo { grid-template-columns:1fr; padding:24px; gap:26px; }
    .bw-body { grid-template-columns:1fr; }
    .bw-art { display:none; }
  }

  /* ── FAQ ACCORDION ──────────────────────────────────────────────────────
     Native <details>/<summary>: keyboard-accessible and open-by-default-safe
     with zero JS. Only the marker and spacing are restyled. */
  .faq-item { background:var(--bg-card); border:1px solid var(--border); border-radius:14px;
    margin-bottom:12px; overflow:hidden; transition:border-color .15s; }
  .faq-item[open] { border-color:color-mix(in srgb, var(--accent) 34%, var(--border)); }
  .faq-item summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:12px;
    padding:17px 20px; font-weight:700; color:var(--bright); font-size:15px; }
  .faq-item summary::-webkit-details-marker { display:none; }
  .faq-item summary .q-ico { width:22px; height:22px; border-radius:50%; background:var(--accent); color:#04150b;
    font-size:13px; font-weight:900; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .faq-item:nth-child(even) summary .q-ico { background:var(--red); color:#fff; }
  .faq-item summary .chev { margin-left:auto; color:var(--accent); transition:transform .2s; font-size:13px; }
  .faq-item[open] summary .chev { transform:rotate(180deg); }
  .faq-item .ans { padding:0 20px 18px 54px; color:var(--dim); font-size:13.5px; line-height:1.75; }

  /* ── SOCIAL PILLS ───────────────────────────────────────────────────────── */
  .soc-grid { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
  .soc-pill { display:inline-flex; align-items:center; gap:12px; padding:13px 22px; border-radius:40px;
    background:var(--bg-card); border:1px solid var(--border); text-decoration:none; transition:.15s; }
  .soc-pill:hover { transform:translateY(-2px); border-color:var(--accent); background:var(--accent-05); }
  .soc-pill:nth-child(even):hover { border-color:var(--red); background:var(--red-05); }
  .soc-pill .s-ico { width:26px; height:26px; border-radius:8px; background:rgba(255,255,255,.06);
    display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--bright); flex-shrink:0; }
  .soc-pill .s-h { font-weight:800; color:var(--bright); font-size:13.5px; letter-spacing:.04em; text-transform:uppercase; }
  .soc-pill .s-p { font-size:10.5px; color:var(--dim); letter-spacing:.12em; text-transform:uppercase; font-weight:700; }

  .note { font-size:12px; color:var(--dim); margin-top:12px; line-height:1.65; }

  /* ── FOOTER ─────────────────────────────────────────────────────────────── */
  footer { margin-top:64px; border-top:1px solid var(--border); padding:40px 0 26px; position:relative; }
  footer::before { content:''; position:absolute; inset:0 0 auto 0; height:2px; background:var(--duo); opacity:.7; }
  .f-cols { display:grid; grid-template-columns:1.6fr 1fr 1fr 1fr; gap:34px; }
  .f-brand { display:flex; align-items:center; gap:11px; margin-bottom:14px; }

  .f-brand .f-name { font-family:'Exo 2',sans-serif; font-weight:900; font-style:italic; font-size:20px;
    color:var(--bright); letter-spacing:.05em; text-transform:uppercase; }
  .f-disc { font-size:12.5px; color:var(--dim); line-height:1.75; max-width:380px; }
  .f-col h4 { font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--bright);
    font-weight:800; margin-bottom:14px; }
  .f-col a, .f-col span.f-link { display:block; font-size:13px; color:var(--dim); text-decoration:none;
    margin-bottom:10px; transition:color .15s; cursor:pointer; }
  .f-col a:hover, .f-col span.f-link:hover { color:var(--accent); }
  .f-bottom { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    margin-top:34px; padding-top:18px; border-top:1px solid var(--border); font-size:12px; color:var(--dim); }
  .f-bottom b { color:var(--bright); font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
  .f-bottom a { color:var(--accent2); text-decoration:none; }
  @media (max-width:820px) { .f-cols { grid-template-columns:1fr 1fr; gap:26px; } }
  @media (max-width:480px) { .f-cols { grid-template-columns:1fr; } }
  .rg { margin-top:10px; font-size:11.5px; color:var(--dim); opacity:.9; display:inline-block;
    border-top:2px solid var(--red); padding-top:8px; }

  @media (max-width:640px) {
    .pod.rank-1 { transform:none; }
    .nav-links { width:100%; justify-content:center; }
    .hero .prize { font-size:44px; }
  }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="glow glow-3"></div>

<div class="wrap">
  <nav>
    <a class="brand" id="brandLink" href="/">
      <span class="brand-mark" id="brandMark"><span>TB</span></span>
      <img id="brandLogo" class="hidden" alt="">
      <span>
        <div class="brand-name" id="brandName">TiltBros</div>
        <div class="brand-sub" id="brandSub"></div>
      </span>
    </a>
    <div class="nav-links" id="navLinks"></div>
  </nav>

  <div class="linkbar" id="linkbar"></div>

  <!-- ── HOME / LEADERBOARD ─────────────────────────────────────────────── -->
  <div id="view-home">
    <div class="hero">
      <div class="kicker"><span id="heroKicker">Code TILTBROS</span></div>
      <h1 id="heroTitle">MONTHLY WAGER RACE</h1>
      <div class="prize" id="heroPrize"></div>
      <div class="prize-sub" id="heroPrizeSub"></div>
      <div class="tagline" id="heroTagline"></div>
      <div id="heroCtaWrap"></div>
    </div>

    <div class="countdown" id="countdown">
      <div class="cd-cell"><div class="cd-num" id="cdD">--</div><div class="cd-lab">Days</div></div>
      <div class="cd-cell"><div class="cd-num" id="cdH">--</div><div class="cd-lab">Hours</div></div>
      <div class="cd-cell"><div class="cd-num" id="cdM">--</div><div class="cd-lab">Mins</div></div>
      <div class="cd-cell"><div class="cd-num" id="cdS">--</div><div class="cd-lab">Secs</div></div>
    </div>
    <div class="cd-ends">Race closing soon</div>

    <!-- No section heading here on purpose: the hero states the race and the
         countdown + podium speak for themselves. A "Monthly Duelbits
         Leaderboard" title above the podium just repeated the hero in plain
         white and broke the flow. -->
    <div class="sec" style="margin-top:34px;">
      <div class="podium" id="podium"></div>
      <div class="tbl-wrap" id="lbTableWrap"><div id="lbTable"><div class="empty">Loading the board…</div></div></div>
    </div>
  </div>

  <!-- ── RAFFLES ───────────────────────────────────────────────────────── -->
  <div id="view-raffles" class="hidden">
    <div class="sec">
      <div class="sec-head"><h2 id="rfHeadline">Weekly Wager Raffle</h2><div class="rule"></div></div>
      <div class="sec-sub" id="rfBlurb"></div>
      <div class="grid g3" id="rfSteps"></div>
      <div id="rfLive"></div>
      <div class="sec">
        <div class="sec-head"><h2>Recent Raffle Winners</h2><div class="rule"></div></div>
        <div class="grid" id="rfWinners" style="gap:8px;"></div>
      </div>
    </div>
  </div>

  <!-- ── GIVEAWAYS ─────────────────────────────────────────────────────── -->
  <div id="view-giveaways" class="hidden">
    <div class="sec">
      <div class="sec-head"><h2>Giveaways</h2><div class="rule"></div></div>
      <div class="sec-sub" id="gwBlurb"></div>
      <div class="grid g4" id="gwStats" style="margin-bottom:24px;"></div>
      <div class="sec-head"><h2>Past Winners</h2><div class="rule"></div></div>
      <div class="grid" id="gwWinners" style="gap:8px;"></div>
    </div>
  </div>

  <!-- ── BONUSES (wager rewards engine) ────────────────────────────────── -->
  <div id="view-bonuses" class="hidden">
    <div class="sec" id="promoWrap"></div>
    <div class="sec">
      <div class="sec-head"><h2>Bonuses &amp; Wager Rewards</h2><div class="rule"></div></div>
      <div class="sec-sub" id="bnIntro"></div>
      <div id="bnSections"></div>
    </div>

  <!-- ── BOUNTIES ──────────────────────────────────────────────────────── -->
  <div id="view-bounties" class="hidden">
    <div class="sec">
      <div class="sec-head"><h2>Bounties</h2><div class="rule bounty-rule"></div></div>

      <div class="grid g3" id="btItems"></div>

  <div id="view-faq" class="hidden">
    <div class="sec"><div id="faqHead"></div><div id="faqList"></div></div>
  </div>

  <!-- Socials sit at the foot of every view — they're the call to action, not
       a destination, so they're outside the routed views. -->
  <div class="sec" id="socialsBlock"></div>

  <footer>
    <div class="f-cols" id="footCols"></div>
    <div class="f-bottom">
      <div id="footLeft"></div>

      <div class="rg" id="footRg"></div>
    </div>

</div>

<script>
(function () {
  'use strict';
  var CHANNEL = 'thetiltbros';

  // Views this page can route to. "home" is the default (hero + leaderboard).
  var VIEWS = ['home', 'raffles', 'giveaways', 'bonuses', 'bounties', 'faq'];
  var VIEW_LABELS = { home: 'Leaderboard', raffles: 'Raffles', giveaways: 'Giveaways',
                      bonuses: 'Bonuses', bounties: 'Bounties', faq: 'FAQ' };

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function $(id) { return document.getElementById(id); }
  function money(n) {
    var v = Number(n || 0);
    return '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function initials(name) { return String(name || '?').trim().charAt(0).toUpperCase() || '?'; }
  function whenLabel(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  // ── routing ──────────────────────────────────────────────────────────────
  function showView(id) {
    if (VIEWS.indexOf(id) === -1) id = 'home';
    VIEWS.forEach(function (v) {
      var el = $('view-' + v);
      if (el) el.classList.toggle('hidden', v !== id);
    });
    Array.prototype.forEach.call(document.querySelectorAll('#navLinks a'), function (a) {
      a.classList.toggle('on', a.getAttribute('data-view') === id);
    });
    if (location.hash.replace(/^#/, '') !== id) {
      history.replaceState(null, '', id === 'home' ? location.pathname : '#' + id);
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  window.addEventListener('hashchange', function () {
    showView(location.hash.replace(/^#/, '') || 'home');
  });

  function renderNav(pages) {
    // Only offer views that actually have something to show. `pages` comes from
    // the preset, so a client can drop a section by editing the preset alone.
    var ids = ['home'].concat((pages || []).map(function (p) { return p.id; }).filter(function (id) {
      return VIEWS.indexOf(id) !== -1;
    }));
    var labels = {};
    (pages || []).forEach(function (p) { labels[p.id] = p.label; });
    $('navLinks').innerHTML = ids.map(function (id) {
      return '<a data-view="' + id + '" href="#' + (id === 'home' ? '' : id) + '">'
           + esc(labels[id] || VIEW_LABELS[id] || id) + '</a>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('#navLinks a'), function (a) {
      a.addEventListener('click', function (e) { e.preventDefault(); showView(a.getAttribute('data-view')); });
    });
  }

  // ── theme ────────────────────────────────────────────────────────────────
  function applyTheme(t) {
    if (!t) return;
    var map = {
      accent: '--accent', accent2: '--accent2', accentGlow: '--accentGlow', gold: '--gold',
      bg: '--bg', bgCard: '--bg-card', border: '--border', text: '--text', dim: '--dim', bright: '--bright',
    };
    Object.keys(map).forEach(function (k) {
      if (t[k]) document.documentElement.style.setProperty(map[k], t[k]);
    });
  }

  // ── countdown ────────────────────────────────────────────────────────────
  var cdTimer = null;
  function startCountdown(endAt) {
    if (cdTimer) { clearInterval(cdTimer); cdTimer = null; }
    var box = $('countdown');
    if (!endAt) { box.classList.add('hidden'); return; }
    box.classList.remove('hidden');
    function tick() {
      var left = endAt - Date.now();
      if (left <= 0) {
        $('cdD').textContent = $('cdH').textContent = $('cdM').textContent = $('cdS').textContent = '00';
        box.classList.remove('urgent');
        clearInterval(cdTimer); cdTimer = null; return;
      }
      // Final 48h flips the countdown red — see .countdown.urgent.
      box.classList.toggle('urgent', left < 48 * 3600000);
      var s = Math.floor(left / 1000);
      var pad = function (n) { return String(n).padStart(2, '0'); };
      $('cdD').textContent = pad(Math.floor(s / 86400));
      $('cdH').textContent = pad(Math.floor(s % 86400 / 3600));
      $('cdM').textContent = pad(Math.floor(s % 3600 / 60));
      $('cdS').textContent = pad(s % 60);
    }
    tick();
    cdTimer = setInterval(tick, 1000);
  }

  // ── leaderboard ──────────────────────────────────────────────────────────
  function renderPodium(rows, prizes) {
    var el = $('podium');
    if (rows.length < 3) { el.innerHTML = ''; return; }
    // Visual order 2-1-3 so first place sits in the middle.
    var order = [rows[1], rows[0], rows[2]];
    el.innerHTML = order.map(function (r) {
      var crown = r.rank === 1 ? '👑' : (r.rank === 2 ? '🥈' : '🥉');
      var av = r.avatarUrl
        ? '<img src="' + esc(r.avatarUrl) + '" alt="" onerror="this.remove()">'
        : esc(initials(r.username));
      var pz = prizes[r.rank - 1];
      return '<div class="pod rank-' + r.rank + '">'
        + '<div class="crown">' + crown + '</div>'
        + '<div class="av-wrap"><div class="av">' + av + '</div><div class="badge">' + r.rank + '</div></div>'
        + '<div class="nm">' + esc(r.username) + '</div>'
        + '<div class="wg-box"><div class="wg-lab">Total Wagered</div><div class="wg">' + money(r.wagered) + '</div></div>'
        + (pz ? '<div class="pz">' + esc(pz) + '</div>' : '')
        + '</div>';
    }).join('');
  }

  function renderTable(rows, prizes, belowPodium) {
    if (!rows.length) {
      $('lbTable').innerHTML = belowPodium ? '' : '<div class="empty">No wagers on the board yet — be the first.</div>';
      $('lbTableWrap').classList.toggle('hidden', belowPodium);
      return;
    }
    $('lbTableWrap').classList.remove('hidden');
    $('lbTable').innerHTML =
      '<table><thead><tr><th>#</th><th>Player</th><th style="text-align:right">Wagered</th><th style="text-align:right">Prize</th></tr></thead><tbody>'
      + rows.map(function (r) {
        var pz = prizes[r.rank - 1];
        return '<tr>'
          + '<td class="rk">' + r.rank + '</td>'
          + '<td class="nm-cell">' + esc(r.username) + '</td>'
          + '<td class="wg-cell">' + money(r.wagered) + '</td>'
          + '<td class="pz-cell">' + (pz ? esc(pz) : '—') + '</td>'
          + '</tr>';
      }).join('')
      + '</tbody></table>';
  }

  // ── raffles ──────────────────────────────────────────────────────────────
  function renderRaffles(s, content) {
    var c = (content && content.raffles) || {};
    if (c.headline) $('rfHeadline').textContent = c.headline;
    $('rfBlurb').textContent = c.blurb || '';

    $('rfSteps').innerHTML = (c.steps || []).map(function (st, i) {
      return '<div class="card step"><span class="n">' + (i + 1) + '</span>'
        + '<span class="ico">' + esc(st.icon || '🎟️') + '</span>'
        + '<h3>' + esc(st.title) + '</h3><p>' + esc(st.text) + '</p></div>';
    }).join('');

    // Live raffle items come from the shared store payload (isRaffleItem).
    var items = ((s.store && s.store.items) || []).filter(function (i) { return i.isRaffleItem; });
    var draw = c.drawLine ? '<div class="note">' + esc(c.drawLine)
      + (c.winnersPerDraw ? ' · ' + c.winnersPerDraw + ' winners per draw' : '') + '</div>' : '';
    $('rfLive').innerHTML = items.length
      ? '<div class="sec"><div class="sec-head"><h2>Open Raffles</h2><div class="rule"></div></div>'
        + '<div class="grid g3">' + items.map(function (i) {
            return '<div class="card"><h3>' + esc(i.name) + '</h3>'
              + (i.description ? '<p>' + esc(i.description) + '</p>' : '')
              + '<p style="margin-top:10px;color:var(--gold);font-weight:800;">'
              + Number(i.price || 0).toLocaleString() + ' pts per ticket</p></div>';
          }).join('') + '</div>' + draw + '</div>'
      : draw;
  }

  function winnerRow(name, what, ts) {
    return '<div class="win-row">'
      + '<div class="w-av">' + esc(initials(name)) + '</div>'
      + '<div class="w-nm">' + esc(name) + (what ? ' <span class="w-what">— ' + esc(what) + '</span>' : '') + '</div>'
      + '<div class="w-when">' + esc(whenLabel(ts)) + '</div>'
      + '</div>';
  }

  function renderRaffleWinners(s) {
    var list = s.pastWinners || [];
    $('rfWinners').innerHTML = list.length
      ? list.map(function (w) { return winnerRow(w.winner, w.itemName, w.drawnAt); }).join('')
      : '<div class="empty">No raffle draws yet — the first one lands soon.</div>';
  }

  // ── giveaways ────────────────────────────────────────────────────────────
  function renderGiveaways(s, content) {
    var c = (content && content.giveaways) || {};
    $('gwBlurb').textContent = c.blurb || '';

    var gw = s.giveawayWinners || [];
    var rf = s.pastWinners || [];

    // Only tiles backed by real data, plus a hand-set lifetime total when the
    // client provides one. No per-winner prize value is stored anywhere, so a
    // computed "total given away" would be invented — the tile stays hidden
    // until someone sets content.giveaways.totalGivenAway.
    var tiles = [];
    if (c.totalGivenAway) {
      tiles.push({ v: esc(c.totalGivenAway), l: c.sinceLabel ? 'Given away ' + c.sinceLabel : 'Given away' });
    }
    tiles.push({ v: gw.length + (gw.length >= 20 ? '+' : ''), l: 'Giveaway winners' });
    tiles.push({ v: rf.length + (rf.length >= 20 ? '+' : ''), l: 'Raffle winners' });
    var last = gw[0] && gw[0].drawnAt;
    if (last) tiles.push({ v: whenLabel(last), l: 'Last drawn' });

    $('gwStats').innerHTML = tiles.map(function (t) {
      return '<div class="stat"><div class="v">' + t.v + '</div><div class="l">' + esc(t.l) + '</div></div>';
    }).join('');

    $('gwWinners').innerHTML = gw.length
      ? gw.map(function (w) { return winnerRow(w.winner, null, w.drawnAt); }).join('')
      : '<div class="empty">No giveaway winners logged yet.</div>';
  }

  // ── "support the code" promo panel ───────────────────────────────────────
  // The browser window is CSS, not a screenshot: it recolours with the theme,
  // stays sharp on any display, and the cursor loop is a real animation. The
  // artwork panel takes content.promo.promoImage when one is supplied and
  // falls back to a branded gradient otherwise.
  function renderPromo(s, content) {
    var c = (content && content.promo) || null;
    var wrap = $('promoWrap');
    if (!c) { wrap.innerHTML = ''; return; }

    var hero = (s.portal && s.portal.hero) || {};
    var code = c.code || hero.code || '';

    var cursorSvg = '<svg class="bw-cursor" viewBox="0 0 24 24" fill="#fff" aria-hidden="true">'
      + '<path d="M4 2l14 8-6 1.6L14.6 19 12 20l-2.6-7.4L4 15z"/></svg>';

    // Two modes. With a supplied screenshot the window body IS the image, with
    // the cursor and click-ring placed over its Register button. Without one we
    // draw the whole form in CSS so the section still stands up.
    var windowBody = c.promoImage
      ? '<div class="bw-shot"><img src="' + esc(c.promoImage) + '" alt="Signing up on '
        + esc(hostOf(c.ctaHref) || 'Duelbits') + ' with code ' + esc(code) + '">'
        + '<span class="tap"></span>' + cursorSvg + '</div>'
      : '<div class="bw-body">'
        +   '<div class="bw-art"><div class="a-mark">'
        +     esc((s.streamer && s.streamer.providerName) || 'Duelbits')
        +   '</div><div class="a-sub">More wins, bigger rewards</div></div>'
        +   '<div class="bw-form">'
        +     '<div class="bw-tabs"><span>Login</span><span class="on">Register</span></div>'
        +     '<div class="bw-f"><label>Display Name</label><div class="inp">' + esc(displayFor(s)) + '</div></div>'
        +     '<div class="bw-f"><label>Email Address</label><div class="inp">you@example.com</div></div>'
        +     '<div class="bw-f"><label>Password</label><div class="inp">••••••••••••</div></div>'
        +     '<div class="bw-f"><label>Referral / Promo Code</label><div class="inp code">' + esc(code || '—') + '</div></div>'
        +     '<div class="bw-btn">Register</div>'
        +     cursorSvg
        +   '</div>'
        + '</div>';

    wrap.innerHTML =
      '<div class="page-head">'
      + (c.kicker ? '<div class="page-kicker">' + esc(c.kicker) + '</div>' : '')
      + '<h2>' + esc(c.headline || 'Support the code') + '</h2>'
      + (c.blurb ? '<p>' + esc(c.blurb) + '</p>' : '')
      + '</div>'
      + '<div class="promo">'
      +   '<div>'
      +     (c.dealLabel ? '<span class="promo-pill">' + esc(c.dealLabel) + '</span>' : '')
      +     '<h3>' + esc(c.dealTitle || '') + '</h3>'
      +     (c.dealText ? '<div class="p-text">' + esc(c.dealText) + '</div>' : '')
      +     (c.offerTitle
              ? '<div class="offer"><div class="o-lab">' + esc(c.offerLabel || 'Main offer') + '</div>'
                + '<div class="o-val">' + esc(c.offerTitle) + '</div></div>'
              : '')
      +     (code ? '<div class="code-chip">Code <b>' + esc(code) + '</b></div>' : '')
      +     (c.ctaHref
              ? '<div><a class="p-cta" href="' + esc(c.ctaHref) + '" target="_blank" rel="noopener">'
                + esc(c.ctaLabel || 'Claim bonus') + '</a></div>'
              : '')
      +     (c.howHref
              ? '<a class="p-how" href="' + esc(c.howHref) + '" target="_blank" rel="noopener">'
                + esc(c.howLabel || 'How to claim?') + '</a>'
              : '')
      +   '</div>'
      +   '<div class="bw">'
      +     '<div class="bw-bar"><span class="bw-dot"></span><span class="bw-dot"></span><span class="bw-dot"></span>'
      +       '<span class="bw-url">' + esc(hostOf(c.ctaHref) || 'duelbits.com') + '</span></div>'
      +     windowBody
      +   '</div>'
      + '</div>';
  }
  function hostOf(u) {
    try { return new URL(u).host.replace(/^www\./, ''); } catch (e) { return null; }
  }
  function displayFor(s) {
    return (s.streamer && s.streamer.displayName) || 'YourName';
  }

  // ── bonuses (shared rewards-section shapes) ──────────────────────────────
  function renderBonuses(s) {
    var r = (s.portal && s.portal.rewards) || null;
    if (!r) { $('bnSections').innerHTML = '<div class="empty">Nothing here yet.</div>'; return; }
    $('bnIntro').textContent = r.intro || '';
    $('bnSections').innerHTML = (r.sections || []).map(function (sec) {
      var head = '<div class="sec-head" style="margin-top:26px;"><h2>' + esc(sec.title || '') + '</h2><div class="rule"></div></div>'
        + (sec.subtitle ? '<div class="sec-sub">' + esc(sec.subtitle) + '</div>' : '');
      if (sec.type === 'prizes') {
        var places = sec.places || [];
        if (!places.length) return '';
        return head + '<div class="grid g4">' + places.map(function (p) {
          return '<div class="stat"><div class="v">' + esc(p.amount) + '</div><div class="l">' + esc(p.place) + '</div></div>';
        }).join('') + '</div>';
      }
      if (sec.type === 'tiers') {
        return head + '<div class="tbl-wrap">' + (sec.tiers || []).map(function (t) {
          return '<div class="tier-row"><span class="tw">' + esc(t.wager) + '</span><span class="tr">' + esc(t.reward) + '</span></div>';
        }).join('') + '</div>' + (sec.note ? '<div class="note">' + esc(sec.note) + '</div>' : '');
      }
      if (sec.type === 'cards') {
        return head + '<div class="grid g3">' + (sec.cards || []).map(function (cd) {
          return '<div class="card"><h3>' + esc(cd.title) + '</h3><ul>'
            + (cd.bullets || []).map(function (b) { return '<li>' + esc(b) + '</li>'; }).join('') + '</ul></div>';
        }).join('') + '</div>';
      }
      if (sec.type === 'bonus') {
        return head + '<div class="card"><h3 style="color:var(--gold);font-size:24px;">' + esc(sec.reward || '') + '</h3><ul>'
          + (sec.bullets || []).map(function (b) { return '<li>' + esc(b) + '</li>'; }).join('') + '</ul></div>';
      }
      // "list" and anything unrecognised render as a simple bulleted card.
      return head + '<div class="card"><ul>'
        + (sec.bullets || []).map(function (b) { return '<li>' + esc(b) + '</li>'; }).join('') + '</ul></div>';
    }).join('');
  }

  // ── bounties ─────────────────────────────────────────────────────────────
  function renderBounties(content) {
    var c = (content && content.bounties) || {};
    $('btBlurb').textContent = c.blurb || '';
    $('btItems').innerHTML = (c.items || []).map(function (b) {
      return '<div class="card bounty"><span class="ico">' + esc(b.icon || '🎯') + '</span>'
        + '<h3>' + esc(b.title) + '</h3><p>' + esc(b.text) + '</p></div>';
    }).join('');
    $('btNote').textContent = c.note || '';
  }

  // Shared centered header used by every view.
  function pageHead(o) {
    if (!o) return '';
    return '<div class="page-head">'
      + (o.kicker ? '<div class="page-kicker">' + esc(o.kicker) + '</div>' : '')
      + (o.headline ? '<h2>' + esc(o.headline) + '</h2>' : '')
      + (o.pill ? '<div class="live-pill"><span class="dot"></span>' + esc(o.pill) + '</div>' : '')
      + (o.blurb ? '<p>' + esc(o.blurb) + '</p>' : '')
      + '</div>';
  }

  // ── FAQ ──────────────────────────────────────────────────────────────────
  // Native <details>, so it's keyboard-accessible and works without JS.
  function renderFaq(content) {
    var c = (content && content.faq) || null;
    if (!c) { $('faqHead').innerHTML = ''; $('faqList').innerHTML = ''; return; }
    $('faqHead').innerHTML = pageHead(c);
    $('faqList').innerHTML = (c.items || []).map(function (it, i) {
      return '<details class="faq-item"' + (i === 0 ? ' open' : '') + '>'
        + '<summary><span class="q-ico">?</span>' + esc(it.q) + '<span class="chev">▲</span></summary>'
        + '<div class="ans">' + esc(it.a) + '</div>'
        + '</details>';
    }).join('');
  }

  // ── socials ──────────────────────────────────────────────────────────────
  function renderSocialsBlock(s, content) {
    var c = (content && content.socialsSection) || null;
    var el = $('socialsBlock');
    if (!c) { el.innerHTML = ''; return; }
    // Fall back to the streamer's own socials if the preset lists none.
    var items = c.items && c.items.length ? c.items : autoSocials(s);
    el.innerHTML = pageHead(c) + '<div class="soc-grid">' + items.map(function (i) {
      return '<a class="soc-pill" href="' + esc(i.href) + '" target="_blank" rel="noopener">'
        + '<span class="s-ico">' + esc(i.icon || '🔗') + '</span>'
        + '<span class="s-h">' + esc(i.handle || i.label || '') + '</span>'
        + (i.platform ? '<span class="s-p">' + esc(i.platform) + '</span>' : '')
        + '</a>';
    }).join('') + '</div>';
  }
  function autoSocials(s) {
    var soc = (s.streamer && s.streamer.socials) || {}, out = [];
    if (soc.kick)    out.push({ handle: s.streamer.kickChannel, platform: 'Kick',    icon: 'K',  href: soc.kick });
    if (soc.discord) out.push({ handle: 'Discord',              platform: 'Discord', icon: '💬', href: soc.discord });
    if (soc.twitter) out.push({ handle: 'X',                    platform: 'X',       icon: '𝕏',  href: soc.twitter });
    if (soc.youtube) out.push({ handle: 'YouTube',              platform: 'YouTube', icon: '▶️', href: soc.youtube });
    return out;
  }

  // ── footer ───────────────────────────────────────────────────────────────
  function renderFooter(s, content, portal) {
    var f = (content && content.footer) || {};
    var display = (s.streamer && s.streamer.displayName) || 'TiltBros';

    // Quick Links are generated from the nav that actually rendered, so they
    // can never point at a section this portal doesn't have.
    var quick = ['home'].concat((portal.pages || []).map(function (p) { return p.id; }))
      .filter(function (id) { return VIEWS.indexOf(id) !== -1; });
    var labels = { home: 'Leaderboard' };
    (portal.pages || []).forEach(function (p) { labels[p.id] = p.label; });

    var col = function (title, inner) {
      return '<div class="f-col"><h4>' + esc(title) + '</h4>' + inner + '</div>';
    };
    var linkList = function (arr) {
      return (arr || []).map(function (l) {
        return '<a href="' + esc(l.href) + '" target="_blank" rel="noopener">' + esc(l.label) + '</a>';
      }).join('');
    };

    $('footCols').innerHTML =
      '<div>'
      +   '<div class="f-brand"><span class="brand-mark"><span>'
      +     esc(display.slice(0, 2).toUpperCase()) + '</span></span>'
      +     '<span class="f-name">' + esc(display) + '</span></div>'
      +   (f.disclaimer ? '<div class="f-disc">' + esc(f.disclaimer) + '</div>' : '')
      + '</div>'
      + col('Quick Links', quick.map(function (id) {
          return '<span class="f-link" data-goto="' + id + '">'
            + esc(labels[id] || VIEW_LABELS[id] || id) + '</span>';
        }).join(''))
      + col('Partners', linkList(f.partners))
      + col('Socials',  linkList(f.socials && f.socials.length ? f.socials : autoSocials(s).map(function (x) {
          return { label: x.platform, href: x.href };
        })));

    // Footer quick links route in-page rather than reloading.
    Array.prototype.forEach.call($('footCols').querySelectorAll('[data-goto]'), function (el) {
      el.addEventListener('click', function () { showView(el.getAttribute('data-goto')); });
    });

    $('footLeft').innerHTML  = '<b>' + esc(display) + '</b> &copy; ' + new Date().getFullYear();
    $('footRight').textContent = f.bottomNote || '';
  }

  // ── links ────────────────────────────────────────────────────────────────
  function renderLinks(s) {
    var portal = s.portal || {};
    var soc = (s.streamer && s.streamer.socials) || {};
    var out = (portal.links || []).slice();
    if (soc.kick && !out.some(function (l) { return /kick/i.test(l.label); })) out.push({ label: 'Kick', href: soc.kick, icon: '💚' });
    if (soc.discord && !out.some(function (l) { return /discord/i.test(l.label); })) out.push({ label: 'Discord', href: soc.discord, icon: '💬' });
    if (soc.youtube) out.push({ label: 'YouTube', href: soc.youtube, icon: '▶️' });
    if (soc.twitter) out.push({ label: 'X', href: soc.twitter, icon: '𝕏' });
    $('linkbar').innerHTML = out.map(function (l) {
      return '<a href="' + esc(l.href) + '" target="_blank" rel="noopener"><span>' + esc(l.icon || '🔗') + '</span>' + esc(l.label) + '</a>';
    }).join('');
    $('linkbar').classList.toggle('hidden', !out.length);
  }

  // ── load ─────────────────────────────────────────────────────────────────
  async function load() {
    var s;
    try { s = await (await fetch('/api/portal-data?channel=' + CHANNEL)).json(); }
    catch (e) { $('lbTable').innerHTML = '<div class="empty">Couldn\'t load data.</div>'; return; }
    if (!s || s.error) { $('lbTable').innerHTML = '<div class="empty">Portal unavailable.</div>'; return; }
    window.__S = s;

    var portal  = s.portal || {};
    var content = portal.content || {};
    applyTheme(portal.theme);

    var display = (s.streamer && s.streamer.displayName) || 'TiltBros';
    document.title = display + ' — Wager Race';
    $('brandName').textContent = display;
    if (s.streamer && s.streamer.kickChannel) {
      $('brandSub').textContent = 'kick.com/' + s.streamer.kickChannel;
      $('brandLink').href = (s.streamer.socials && s.streamer.socials.kick) || '/';
    }
    // Swap the lettermark for a real logo once one is configured.
    var logo = portal.logoUrl || (s.streamer && s.streamer.logoUrl);
    if (logo) {
      var img = $('brandLogo');
      img.src = logo; img.classList.remove('hidden');
      $('brandMark').classList.add('hidden');
    }

    var hero = portal.hero || {};
    if (hero.code) $('heroKicker').textContent = 'Code ' + hero.code;
    if (hero.title) $('heroTitle').textContent = hero.title;
    $('heroPrize').textContent = hero.prize || '';
    $('heroPrizeSub').textContent = hero.prize ? ((hero.cadence || '') + ' prize pool').trim() : '';
    $('heroTagline').textContent = hero.tagline || '';
    $('heroCtaWrap').innerHTML = hero.ctaHref
      ? '<a class="cta" href="' + esc(hero.ctaHref) + '" target="_blank" rel="noopener">' + esc(hero.ctaLabel || 'Play now') + '</a>'
      : '';

    if (portal.bgImage) {
      document.body.style.background =
        'linear-gradient(rgba(7,8,13,.9),rgba(7,8,13,.96)), url("' + portal.bgImage + '") center/cover fixed no-repeat';
    }

    startCountdown(s.leaderboardTimer && s.leaderboardTimer.active ? s.leaderboardTimer.endAt : null);

    var lb = s.leaderboard || {};

    // portal-data returns { rank, name, wagerAmount }; normalize to what the
    // podium/table expect. Top 10 only — that's the paid field.
    var ranks = (lb.rankings || []).map(function (r) {
      return {
        rank: r.rank,
        username: r.name || r.username,
        wagered: r.wagerAmount != null ? r.wagerAmount : r.wagered,
        avatarUrl: r.avatarUrl || null,
      };
    }).slice(0, 10);
    var prizes = portal.prizes || [];
    var hasPodium = ranks.length >= 3;
    renderPodium(ranks, prizes);
    renderTable(hasPodium ? ranks.slice(3) : ranks, prizes, hasPodium);

    renderLinks(s);
    renderNav(portal.pages || []);
    renderRaffles(s, content);
    renderRaffleWinners(s);
    renderGiveaways(s, content);
    renderPromo(s, content);
    renderBonuses(s);
    renderBounties(content);
    renderFaq(content);
    renderSocialsBlock(s, content);
    renderFooter(s, content, portal);

    $('footCredit').innerHTML = portal.brandCredit === false
      ? '&copy; ' + new Date().getFullYear() + ' ' + esc(display)
      : 'Powered by <a href="https://wenbot.gg" target="_blank" rel="noopener">WenBot</a>';
    $('footRg').textContent = content.responsible || '';

    // Honor a deep link once, on first load only — a later refresh must not
    // yank a reader out of whatever section they're on.
    if (!window.__routedOnce) {
      window.__routedOnce = true;
      var segs = location.pathname.replace(/^\/+|\/+$/g, '').split('/').map(function (x) { return x.toLowerCase(); });
      var fromPath = segs.filter(function (x) { return VIEWS.indexOf(x) !== -1; })[0];
      showView(location.hash.replace(/^#/, '') || fromPath || 'home');
    }
  }

  load();
  setInterval(load, 60000);
})();
</script>
</body>
</html>
