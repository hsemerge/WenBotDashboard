<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WenBot — Commands</title>
  <meta name="description" content="Every WenBot command for Kick chat and Discord — points, store, games, bonus hunt and more.">
  <link rel="stylesheet" href="/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { padding: 0 0 60px; }
    .cm-wrap { max-width: 1000px; margin: 0 auto; padding: 0 20px; }

    .cm-hero { text-align: center; padding: 48px 0 28px; }
    .cm-logo img { height: 64px; max-width: 220px; object-fit: contain; }
    .cm-title {
      font-family: 'Exo 2', sans-serif; font-size: clamp(28px, 5vw, 42px);
      font-weight: 900; color: var(--bright); margin: 18px 0 8px; letter-spacing: -0.01em;
    }
    .cm-sub { font-size: 15px; color: var(--text-dim); max-width: 560px; margin: 0 auto; line-height: 1.6; }
    .cm-channel {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 16px;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 999px;
      padding: 6px 16px; font-size: 13px; color: var(--text-dim);
    }
    .cm-channel strong { color: var(--accent); }

    /* Platform filter */
    .cm-filter { display: flex; gap: 8px; justify-content: center; margin: 28px 0 8px; flex-wrap: wrap; }
    .cm-fbtn {
      background: var(--bg-card); border: 1px solid var(--border); color: var(--text-dim);
      font-family: inherit; font-size: 13px; font-weight: 700;
      padding: 8px 20px; border-radius: 999px; cursor: pointer;
      transition: color .15s, border-color .15s, background .15s;
    }
    .cm-fbtn:hover { color: var(--bright); border-color: var(--accent); }
    .cm-fbtn.active { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    .cm-fbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .cm-search {
      display: block; width: 100%; max-width: 420px; margin: 14px auto 0;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); padding: 10px 14px; font-family: inherit; font-size: 14px;
    }
    .cm-search:focus { outline: none; border-color: var(--accent); }

    .cm-group { margin-top: 34px; }
    .cm-group-title {
      font-family: 'Exo 2', sans-serif; font-size: 13px; font-weight: 800;
      text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim);
      margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
    }
    .cm-list { display: grid; gap: 10px; }
    .cm-row {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px 16px; display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap;
    }
    .cm-names { display: flex; flex-direction: column; gap: 6px; min-width: 190px; }
    .cm-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px;
      font-weight: 600; color: var(--accent); background: var(--bg);
      border: 1px solid var(--border); border-radius: 6px; padding: 4px 9px;
      display: inline-block; width: fit-content; cursor: pointer;
    }
    .cm-code:hover { border-color: var(--accent); }
    .cm-code.discord { color: #a5b4fc; }
    .cm-body { flex: 1; min-width: 220px; }
    .cm-desc { font-size: 14px; color: var(--bright); line-height: 1.5; }
    .cm-meta { font-size: 12px; color: var(--text-dim); margin-top: 5px; line-height: 1.6; }
    .cm-meta code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 4px; padding: 1px 5px; color: var(--text);
    }
    .cm-mod {
      font-size: 10px; font-weight: 800; letter-spacing: .06em;
      background: rgba(255,255,255,.06); border: 1px solid var(--border);
      color: var(--text-dim); padding: 2px 8px; border-radius: 999px; align-self: flex-start;
    }

    .cm-note {
      background: var(--bg-card); border: 1px dashed var(--border); border-radius: 10px;
      padding: 16px; font-size: 13px; color: var(--text-dim); margin-top: 24px; line-height: 1.6;
    }
    .cm-empty { text-align: center; color: var(--text-dim); padding: 40px 0; font-size: 14px; }
    .cm-foot { text-align: center; margin-top: 48px; font-size: 13px; color: var(--text-dim); }
    .cm-foot a { color: var(--accent); text-decoration: none; }
    .cm-foot a:hover { text-decoration: underline; }
    .cm-toast {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
      background: var(--bg-panel); border: 1px solid var(--accent); color: var(--bright);
      padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 600;
      opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 50;
    }
    .cm-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 560px) {
      .cm-row { flex-direction: column; gap: 10px; }
      .cm-names { flex-direction: row; flex-wrap: wrap; min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="cm-wrap">
    <div class="cm-hero">
      <div class="cm-logo"><img src="/img/logo.png" alt="WenBot"></div>
      <h1 class="cm-title">Commands</h1>
      <p class="cm-sub" id="cmSub">Everything you can type in Kick chat and Discord.</p>
      <div class="cm-channel" id="cmChannel" style="display:none;"></div>
    </div>

    <div class="cm-filter">
      <button class="cm-fbtn active" data-p="all"     onclick="setPlatform('all', this)">All</button>
      <button class="cm-fbtn"        data-p="chat"    onclick="setPlatform('chat', this)">Kick chat</button>
      <button class="cm-fbtn"        data-p="discord" onclick="setPlatform('discord', this)">Discord</button>
    </div>
    <input class="cm-search" id="cmSearch" type="search" placeholder="Search commands…" oninput="render()" autocomplete="off">

    <div id="cmContent"><div class="cm-empty">Loading commands…</div></div>

    <div class="cm-foot">
      Powered by <a href="/">WenBot</a> · <a href="/community">Community</a>
    </div>
  </div>
  <div class="cm-toast" id="cmToast">Copied</div>

  <script>
    // Channel comes from ?channel= (what !commands links to) or the path
    // (/commands/someone), so a streamer can share either shape.
    const params  = new URLSearchParams(location.search);
    const pathBit = location.pathname.replace(/^\/commands\/?/, "").replace(/\/$/, "");
    const CHANNEL = (params.get("channel") || pathBit || "").toLowerCase().trim();

    let DATA = null, platform = "all";

    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function setPlatform(p, btn) {
      platform = p;
      document.querySelectorAll(".cm-fbtn").forEach((b) => b.classList.toggle("active", b === btn));
      render();
    }

    function copyCmd(text) {
      navigator.clipboard?.writeText(text).then(() => {
        const t = document.getElementById("cmToast");
        t.textContent = "Copied " + text;
        t.classList.add("show");
        clearTimeout(window.__cmT);
        window.__cmT = setTimeout(() => t.classList.remove("show"), 1400);
      }).catch(() => {});
    }

    function render() {
      const box = document.getElementById("cmContent");
      if (!DATA) return;
      const q = (document.getElementById("cmSearch").value || "").toLowerCase().trim();

      const rows = DATA.commands.filter((c) => {
        if (platform === "chat"    && !c.chat)    return false;
        if (platform === "discord" && !c.discord) return false;
        if (!q) return true;
        return [c.chat, c.discord, c.desc, ...(c.also || [])]
          .filter(Boolean).join(" ").toLowerCase().includes(q);
      });

      if (!rows.length) {
        box.innerHTML = '<div class="cm-empty">No commands match that search.</div>';
        return;
      }

      // Preserve the catalogue's grouping order rather than sorting alphabetically —
      // it runs from what viewers use most to what only mods touch.
      const groups = [];
      rows.forEach((c) => {
        let g = groups.find((x) => x.name === c.group);
        if (!g) groups.push((g = { name: c.group, items: [] }));
        g.items.push(c);
      });

      box.innerHTML = groups.map((g) => `
        <div class="cm-group">
          <div class="cm-group-title">${esc(g.name)}</div>
          <div class="cm-list">
            ${g.items.map((c) => {
              const names = [];
              if (c.chat && platform !== "discord")
                names.push(`<span class="cm-code" onclick="copyCmd('${esc(c.chat)}')" title="Copy">${esc(c.chat)}</span>`);
              if (c.discord && platform !== "chat")
                names.push(`<span class="cm-code discord" onclick="copyCmd('${esc(c.discord)}')" title="Copy">${esc(c.discord)}</span>`);
              const meta = [];
              if (c.usage && platform !== "discord") meta.push(`Example: <code>${esc(c.usage)}</code>`);
              if (c.also && c.also.length && platform !== "discord")
                meta.push("Also: " + c.also.map((a) => `<code>${esc(a)}</code>`).join(" "));
              return `
                <div class="cm-row">
                  <div class="cm-names">${names.join("")}</div>
                  <div class="cm-body">
                    <div class="cm-desc">${esc(c.desc)}</div>
                    ${meta.length ? `<div class="cm-meta">${meta.join(" · ")}</div>` : ""}
                  </div>
                  ${c.mod ? '<span class="cm-mod">MODS</span>' : ""}
                </div>`;
            }).join("")}
          </div>
        </div>`).join("") + notesHtml();
    }

    // Say plainly when a feature is off here, instead of silently omitting it and
    // leaving a viewer wondering why the list looks short.
    function notesHtml() {
      if (!DATA || !DATA.channel) return "";
      const f = DATA.features || {};
      const notes = [];
      if (!f.points) notes.push("The points system is switched off on this channel, so points, store and game commands aren't available.");
      else if (!f.gamesKick && !f.gamesDiscord) notes.push("Chat games aren't switched on here.");
      else if (!f.gamesKick) notes.push("Chat games are available in Discord on this channel, but not in Kick chat.");
      else if (!f.gamesDiscord) notes.push("Chat games are available in Kick chat on this channel, but not in Discord.");
      return notes.length ? `<div class="cm-note">${notes.map(esc).join("<br>")}</div>` : "";
    }

    (async () => {
      try {
        const url = "/api/commands-data" + (CHANNEL ? "?channel=" + encodeURIComponent(CHANNEL) : "");
        const r = await fetch(url);
        DATA = await r.json();
        if (!r.ok) throw new Error(DATA.error || "Failed to load");
      } catch (e) {
        document.getElementById("cmContent").innerHTML =
          '<div class="cm-empty">Couldn\'t load the command list. Please refresh.</div>';
        return;
      }

      if (DATA.channel) {
        const el = document.getElementById("cmChannel");
        el.style.display = "";
        el.innerHTML = "Showing commands for <strong>" + esc(DATA.displayName || DATA.channel) + "</strong>";
        document.getElementById("cmSub").textContent =
          "These are the commands this channel actually has switched on, with any renamed triggers.";
      }
      render();
    })();
  </script>
</body>
</html>
