<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WenBot — Commands</title>
  <meta name="description" content="Every WenBot command for Kick chat and Discord: points, store, games, bonus hunt and more.">
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Self-contained on purpose. /css/styles.css is the dashboard APP SHELL and
       sets html,body{height:100%;overflow:hidden} so an inner pane can scroll —
       inheriting that locked this page and made it unscrollable. */
    :root {
      --bg:       #0d1117;
      --bg-panel: #141a23;
      --bg-card:  #1a212c;
      --border:   #263041;
      --text:     #c9d4e3;
      --dim:      #8496ad;
      --bright:   #f0f6fc;
      --kick:     #00e5ff;
      --discord:  #a5b4fc;
      --mod:      #f5c518;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      height: auto; min-height: 100%; overflow-x: hidden; overflow-y: auto;
      background: var(--bg); color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--kick); }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px 80px; }

    /* ── Hero ─────────────────────────────────────────────────────────── */
    .hero { text-align: center; padding: 44px 0 26px; }
    .hero img { height: 56px; max-width: 200px; object-fit: contain; }
    h1 {
      font-family: 'Exo 2', sans-serif; font-weight: 900;
      font-size: clamp(30px, 5vw, 44px); color: var(--bright);
      margin: 16px 0 10px; letter-spacing: -.02em;
    }
    .lede { font-size: 16px; color: var(--dim); max-width: 560px; margin: 0 auto; line-height: 1.6; }
    .chan {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 18px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 999px; padding: 7px 18px; font-size: 14px; color: var(--dim);
    }
    .chan b { color: var(--kick); font-weight: 700; }

    /* ── Sticky toolbar ───────────────────────────────────────────────── */
    .bar {
      position: sticky; top: 0; z-index: 20;
      background: rgba(13,17,23,.92); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 14px 0; margin-bottom: 8px;
    }
    .bar-in { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
    .segs { display: flex; gap: 4px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 999px; padding: 4px; }
    .seg {
      background: none; border: none; color: var(--dim); cursor: pointer;
      font: 700 13px/1 'Inter', sans-serif; padding: 8px 18px; border-radius: 999px;
      transition: background .15s, color .15s; white-space: nowrap;
    }
    .seg:hover { color: var(--bright); }
    .seg.on { background: var(--kick); color: #06121a; }
    .seg.on.dc { background: var(--discord); color: #10132a; }
    .search {
      flex: 1; min-width: 220px; max-width: 340px;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 999px;
      color: var(--text); padding: 11px 18px; font: 400 14px 'Inter', sans-serif;
    }
    .search::placeholder { color: var(--dim); }
    .search:focus { outline: none; border-color: var(--kick); }

    /* ── Jump nav ─────────────────────────────────────────────────────── */
    .jump { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 18px 0 4px; }
    .jump a {
      font-size: 12px; font-weight: 600; color: var(--dim); text-decoration: none;
      border: 1px solid var(--border); border-radius: 999px; padding: 5px 13px;
      transition: color .15s, border-color .15s;
    }
    .jump a:hover { color: var(--bright); border-color: var(--kick); }

    /* ── Groups ───────────────────────────────────────────────────────── */
    .group { margin-top: 40px; scroll-margin-top: 90px; }
    .group-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
    .group-head h2 {
      font-family: 'Exo 2', sans-serif; font-size: 20px; font-weight: 800;
      color: var(--bright); margin: 0; letter-spacing: -.01em;
    }
    .group-head span { font-size: 13px; color: var(--dim); }

    /* Aligned list, not cards. The trigger column is a fixed width so every
       command starts on the same vertical line and the eye can scan straight
       down; boxes-per-command broke that rhythm and ate the width. */
    .list { border-top: 1px solid var(--border); }
    .row {
      display: grid; grid-template-columns: 240px minmax(0, 1fr) auto;
      gap: 24px; align-items: baseline;
      padding: 15px 12px; border-bottom: 1px solid var(--border);
      transition: background .12s;
    }
    .row:hover { background: rgba(255,255,255,.022); }

    .triggers { display: flex; gap: 8px; flex-wrap: wrap; }
    .trig {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px; font-weight: 600; letter-spacing: -.01em;
      padding: 4px 9px; border-radius: 6px; cursor: pointer;
      border: 1px solid transparent; background: rgba(0,229,255,.08); color: var(--kick);
      transition: border-color .15s;
      white-space: nowrap;
    }
    .trig:hover { border-color: currentColor; }
    .trig.dc { background: rgba(165,180,252,.09); color: var(--discord); }

    .desc { font-size: 14.5px; line-height: 1.5; color: var(--bright); }
    .meta { font-size: 12.5px; color: var(--dim); line-height: 1.6; margin-top: 4px; }
    .meta b { color: var(--text); font-weight: 600; }
    .sep { opacity: .45; margin: 0 7px; }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 5px; padding: 2px 6px; color: var(--text);
    }
    .badge-mod {
      font-size: 10px; font-weight: 800; letter-spacing: .07em; white-space: nowrap;
      color: var(--mod); border: 1px solid rgba(245,197,24,.3);
      background: rgba(245,197,24,.07); padding: 3px 9px; border-radius: 999px;
    }

    .note {
      background: rgba(245,197,24,.06); border: 1px solid rgba(245,197,24,.25);
      border-radius: 10px; padding: 14px 16px; margin-top: 28px;
      font-size: 13.5px; color: var(--text); line-height: 1.6;
    }
    .empty { text-align: center; color: var(--dim); padding: 60px 0; font-size: 15px; }
    .pagefoot { text-align: center; margin-top: 56px; font-size: 13px; color: var(--dim); }
    .pagefoot a { text-decoration: none; }
    .pagefoot a:hover { text-decoration: underline; }

    .toast {
      position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(16px);
      background: var(--bg-panel); border: 1px solid var(--kick); color: var(--bright);
      padding: 11px 20px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
      opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 60;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 700px) {
      .row { grid-template-columns: 1fr; gap: 8px; padding: 14px 4px; }
      .badge-mod { justify-self: start; }
      .bar-in { flex-direction: column; }
      .search { max-width: 100%; width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <img src="/img/logo.png" alt="WenBot">
      <h1>Commands</h1>
      <p class="lede" id="lede">Everything you can type in Kick chat and Discord.</p>
      <div class="chan" id="chan" style="display:none;"></div>
    </div>
  </div>

  <div class="bar">
    <div class="wrap" style="padding-bottom:0;">
      <div class="bar-in">
        <div class="segs">
          <button class="seg on" data-p="all"     onclick="setP('all',this)">All</button>
          <button class="seg"    data-p="chat"    onclick="setP('chat',this)">Kick chat</button>
          <button class="seg"    data-p="discord" onclick="setP('discord',this)">Discord</button>
        </div>
        <input class="search" id="q" type="search" placeholder="Search commands…" oninput="render()" autocomplete="off">
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="jump" id="jump"></div>
    <div id="out"><div class="empty">Loading commands…</div></div>
    <div class="pagefoot">Powered by <a href="/">WenBot</a> · <a href="/community">Community</a></div>
  </div>
  <div class="toast" id="toast">Copied</div>

  <script>
    const params  = new URLSearchParams(location.search);
    const pathBit = location.pathname.replace(/^\/commands\/?/, "").replace(/\/$/, "");
    const CHANNEL = (params.get("channel") || pathBit || "").toLowerCase().trim();

    let DATA = null, platform = "all";
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-");

    function setP(p, btn) {
      platform = p;
      document.querySelectorAll(".seg").forEach((b) => {
        b.classList.toggle("on", b === btn);
        b.classList.toggle("dc", b === btn && p === "discord");
      });
      render();
    }

    function copy(text) {
      navigator.clipboard?.writeText(text).then(() => {
        const t = document.getElementById("toast");
        t.textContent = "Copied  " + text;
        t.classList.add("show");
        clearTimeout(window.__t);
        window.__t = setTimeout(() => t.classList.remove("show"), 1500);
      }).catch(() => {});
    }

    function render() {
      const box = document.getElementById("out");
      if (!DATA) return;
      const q = (document.getElementById("q").value || "").toLowerCase().trim();

      const rows = DATA.commands.filter((c) => {
        if (platform === "chat"    && !c.chat)    return false;
        if (platform === "discord" && !c.discord) return false;
        if (!q) return true;
        return [c.chat, c.discord, c.desc, ...(c.also || [])]
          .filter(Boolean).join(" ").toLowerCase().includes(q);
      });

      if (!rows.length) {
        document.getElementById("jump").innerHTML = "";
        box.innerHTML = '<div class="empty">Nothing matches that search.</div>';
        return;
      }

      // Keep the catalogue's order — it runs from what viewers use most down to
      // what only mods touch, which alphabetical sorting would destroy.
      const groups = [];
      rows.forEach((c) => {
        let g = groups.find((x) => x.name === c.group);
        if (!g) groups.push((g = { name: c.group, items: [] }));
        g.items.push(c);
      });

      document.getElementById("jump").innerHTML = groups
        .map((g) => `<a href="#g-${slug(g.name)}">${esc(g.name)}</a>`).join("");

      box.innerHTML = groups.map((g) => `
        <section class="group" id="g-${slug(g.name)}">
          <div class="group-head">
            <h2>${esc(g.name)}</h2>
            <span>${g.items.length} command${g.items.length === 1 ? "" : "s"}</span>
          </div>
          <div class="list">
            ${g.items.map((c) => {
              const trigs = [];
              if (c.chat && platform !== "discord")
                trigs.push(`<span class="trig" onclick="copy('${esc(c.chat)}')" title="Click to copy">${esc(c.chat)}</span>`);
              if (c.discord && platform !== "chat")
                trigs.push(`<span class="trig dc" onclick="copy('${esc(c.discord)}')" title="Click to copy">${esc(c.discord)}</span>`);

              const bits = [];
              if (c.usage && platform !== "discord")
                bits.push(`<b>Example</b> <code>${esc(c.usage)}</code>`);
              if (c.also && c.also.length && platform !== "discord")
                bits.push(`<b>Also</b> ${c.also.map((a) => `<code>${esc(a)}</code>`).join(" ")}`);
              // Only worth saying when both platforms are on screen at once.
              if (platform === "all") {
                if (c.chat && c.discord)      bits.push("Kick chat + Discord");
                else if (c.discord && !c.chat) bits.push("Discord only");
                else if (c.chat && !c.discord) bits.push("Kick chat only");
              }

              return `
                <div class="row">
                  <div class="triggers">${trigs.join("")}</div>
                  <div>
                    <div class="desc">${esc(c.desc)}</div>
                    ${bits.length ? `<div class="meta">${bits.join('<span class="sep">·</span>')}</div>` : ""}
                  </div>
                  ${c.mod ? '<span class="badge-mod">MODS</span>' : "<span></span>"}
                </div>`;
            }).join("")}
          </div>
        </section>`).join("") + notes();
    }

    // Say plainly when something is switched off here, instead of silently
    // omitting it and leaving a viewer wondering why the list looks short.
    function notes() {
      if (!DATA || !DATA.channel) return "";
      const f = DATA.features || {}, n = [];
      if (!f.points) n.push("The points system is switched off on this channel, so points, store and game commands aren't available.");
      else if (!f.gamesKick && !f.gamesDiscord) n.push("Chat games aren't switched on here.");
      else if (!f.gamesKick) n.push("Chat games work in Discord on this channel, but not in Kick chat.");
      else if (!f.gamesDiscord) n.push("Chat games work in Kick chat on this channel, but not in Discord.");
      return n.length ? `<div class="note">${n.map(esc).join("<br>")}</div>` : "";
    }

    (async () => {
      try {
        const r = await fetch("/api/commands-data" + (CHANNEL ? "?channel=" + encodeURIComponent(CHANNEL) : ""));
        DATA = await r.json();
        if (!r.ok) throw new Error(DATA.error || "Failed to load");
      } catch (e) {
        document.getElementById("out").innerHTML =
          '<div class="empty">Couldn\'t load the command list. Please refresh.</div>';
        return;
      }
      if (DATA.channel) {
        const el = document.getElementById("chan");
        el.style.display = "";
        el.innerHTML = "Showing commands for <b>" + esc(DATA.displayName || DATA.channel) + "</b>";
        document.getElementById("lede").textContent =
          "These are the commands this channel has switched on, including any renamed triggers.";
      }
      render();
    })();
  </script>
</body>
</html>
