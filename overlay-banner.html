<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotating Banner Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700;800;900&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<!--
  ROTATING LOWER-THIRD BANNER — sits along the bottom of the stream and cycles
  through a deck of slides.

  Data comes from /api/portal-data?channel=<slug>, the same endpoint the portals
  use, so the prize pool, affiliate code, live wager standings and race
  countdown are always the real numbers. No dashboard setup and no extra
  endpoint: point OBS at it and it runs.

  Query params
    ?channel=<slug>   required — whose data to show
    ?layout=bar       "bar" (default, solid lower third) or "transparent"
                      (no bar — text floats over the stream, with heavy shadows
                      so it stays readable on a bright scene)
    ?secs=8           seconds per slide (default 8)
    ?rows=3           how many leaderboard positions to rotate through (default 3)
    ?accent=00e676    override the accent (hex, no #); defaults to the portal theme
    ?bg=0b1220        override the bar background (bar layout only)
    ?slides=promo,leaders,countdown,raffle,custom   pick/order the deck
    ?preview=1        paint a mock scene behind it, for checking the transparent
                      layout in a normal browser tab. Never use this in OBS.

  Sizes: bar 1920×110, transparent 1920×130. Anchor it to the bottom of the
  scene. OBS browser sources are transparent by default, so nothing extra is
  needed for the transparent layout.
-->
<style>
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    /* Tuned to the TiltBros banner artwork this sits on: deep navy body, teal
       rising from the bottom edge, cyan hairline, green for the wordmark. */
    --accent:#3ddc6b;   /* wordmark green */
    --accent2:#22d3ee;  /* cyan hairline / secondary */
    --teal:#14b8a6;     /* the glow that lifts off the bottom edge */
    --gold:#ffd24a;
    --bar:#0a141c;
    --bright:#fff; --dim:#a9c2ce;
  }
  html,body { height:100%; background:transparent; overflow:hidden; }
  body { font-family:'Inter',sans-serif; display:flex; align-items:flex-end; }

  /* Solid bar, matched to the TiltBros banner artwork: deep navy body with a
     teal glow lifting off the BOTTOM edge (not the top, as before) and a cyan
     hairline framing it. */
  .bar {
    position:relative; width:100%; height:110px; overflow:hidden;
    background:var(--bar);
    border-top:1px solid color-mix(in srgb, var(--accent2) 55%, transparent);
    border-bottom:1px solid color-mix(in srgb, var(--accent2) 55%, transparent);
    display:flex; align-items:center; justify-content:center;
  }
  /* The teal-to-green wash rising from the floor of the bar. */
  .bar::before {
    content:''; position:absolute; inset:auto 0 0 0; height:70%;
    background:linear-gradient(0deg,
      color-mix(in srgb, var(--teal) 55%, transparent) 0%,
      color-mix(in srgb, var(--teal) 18%, transparent) 45%,
      transparent 100%);
    pointer-events:none;
  }
  /* A brighter line right on the bottom edge, where the artwork is hottest. */
  .bar::after {
    content:''; position:absolute; left:0; right:0; bottom:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
    opacity:.9; pointer-events:none;
  }
  /* Content has to clear the two pseudo-element washes. */
  #slides { position:absolute; inset:0; z-index:1; }

  /* Slides stack; only the active one is visible. */
  .slide {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    padding:0 40px; text-align:center;
    opacity:0; transform:translateY(10px); transition:opacity .5s ease, transform .5s ease;
    pointer-events:none;
  }
  .slide.on { opacity:1; transform:none; }

  .mid { display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.05; }
  .kick { font-size:14px; font-weight:800; letter-spacing:.28em; text-transform:uppercase; color:var(--dim); }
  /* Numbers are WHITE, not green. The artwork already spends its green on the
     TILTBROS wordmark, so a green figure next to it reads as a second logo
     rather than as data. White carries a teal halo instead, which ties it to
     the bar's glow without competing. */
  .big {
    font-family:'Exo 2',sans-serif; font-weight:900; font-size:46px; letter-spacing:.01em; margin:5px 0 4px;
    color:var(--bright);
    text-shadow:0 0 22px color-mix(in srgb, var(--teal) 60%, transparent),
                0 2px 4px rgba(0,0,0,.55);
  }
  .big.gold { color:var(--gold); text-shadow:0 0 22px rgba(255,210,74,.4), 0 2px 4px rgba(0,0,0,.55); }
  .sub { font-size:14px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
  /* The code / highlighted word is where green belongs — it's the call to
     action, and it echoes the wordmark deliberately. */
  .sub b { color:var(--accent); }

  /* Preview backdrop. A transparent overlay opened in a normal browser sits on
     white, which makes it look broken — this paints a stream-ish dark scene so
     it can be checked outside OBS. Never on by default: OBS needs the real
     transparency. */
  body.preview { background:#15181c; }
  body.preview::before {
    content:''; position:fixed; inset:0; z-index:-1;
    background:repeating-linear-gradient(45deg,#1b1f24 0 22px,#15181c 22px 44px);
  }

  /* ── TRANSPARENT LAYOUT ──────────────────────────────────────────────────
     Designed to sit ON TOP of the TiltBros banner artwork — a dark navy bar
     with teal lifting off its bottom edge — not over an arbitrary scene.
     That changes the shadow strategy: a heavy black drop-shadow goes muddy
     against the teal glow, so this uses a tight dark contact shadow for edge
     definition plus a teal halo that reads as part of the artwork's own light.
     Text stays white so it never competes with the green wordmark. */
  body.transparent .bar {
    background:none; border-top:none; border-bottom:none; box-shadow:none; height:130px;
  }
  body.transparent .bar::before,
  body.transparent .bar::after { display:none; }
  body.transparent .kick,
  body.transparent .sub {
    color:#eaf4f8;
    text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 14px color-mix(in srgb, var(--teal) 45%, transparent);
  }
  body.transparent .sub b { color:var(--accent); text-shadow:0 1px 3px rgba(0,0,0,.85); }
  body.transparent .big {
    font-size:54px; color:var(--bright);
    text-shadow:0 2px 5px rgba(0,0,0,.9),
                0 0 26px color-mix(in srgb, var(--teal) 65%, transparent),
                0 0 52px color-mix(in srgb, var(--teal) 35%, transparent);
  }
  body.transparent .big.gold {
    color:var(--gold);
    text-shadow:0 2px 5px rgba(0,0,0,.9), 0 0 26px rgba(255,210,74,.5);
  }

  /* Preview backdrop for the transparent layout mimics the real banner, so it
     can be judged against what it will actually sit on rather than a guess. */
  body.preview.transparent { background:#0a141c; }
  body.preview.transparent::before {
    background:
      linear-gradient(0deg, color-mix(in srgb, var(--teal) 55%, transparent) 0%,
                            color-mix(in srgb, var(--teal) 15%, transparent) 45%,
                            transparent 100%),
      #0a141c;
  }

  @media (max-width:1100px) { .big { font-size:38px; } }

  /* ── MARQUEE LAYOUT ─────────────────────────────────────────────────────
     A top strip that scrolls continuously rather than fading between slides.

     Seamlessness: the track holds the item list repeated enough times to be
     WIDER than the viewport plus one set, and shifts left by exactly one set
     width (--shift, in px) before restarting. Because copy N+1 sits precisely
     where copy N began, the restart is invisible.

     Two copies alone is NOT enough — if one set is narrower than the screen
     you can see the seam between the copies, which reads as the content
     repeating itself. The repeat count is computed from the measured width. */
  body.marquee { align-items:flex-start; }
  body.marquee .bar {
    height:70px; border-top:none;
    border-bottom:1px solid color-mix(in srgb, var(--accent2) 55%, transparent);
    justify-content:flex-start; overflow:hidden;
  }
  body.marquee .bar::before {
    inset:0 0 auto 0; height:100%;
    background:linear-gradient(180deg,
      color-mix(in srgb, var(--teal) 40%, transparent) 0%,
      transparent 85%);
  }
  body.marquee .bar::after { top:auto; bottom:0; }
  /* Feather both ends so items enter and leave rather than popping. */
  body.marquee #slides {
    position:absolute; inset:0; display:flex; align-items:center;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);
  }
  /* Driven by requestAnimationFrame, not a CSS animation. A CSS animation
     always RESTARTS at the end of its cycle, so any sub-pixel error between
     the measured set width and the real one shows up as a skip on every loop.
     The rAF loop instead advances a continuous offset and wraps it modulo one
     set width — because the content is periodic, that wrap is mathematically
     invisible and there is no reset to see. */
  .mq-track { display:flex; align-items:center; white-space:nowrap; will-change:transform; }

  .mq-item { display:inline-flex; align-items:center; gap:12px; padding:0 34px; flex-shrink:0; }
  .mq-item .mq-ico { width:26px; height:26px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .mq-item .mq-ico svg { width:100%; height:100%; }
  .mq-item .mq-txt {
    font-family:'Exo 2',sans-serif; font-weight:800; font-size:25px; letter-spacing:.02em;
    color:var(--bright); text-shadow:0 2px 4px rgba(0,0,0,.6);
  }
  /* Separator between items. */
  .mq-sep { width:5px; height:5px; border-radius:50%; background:var(--accent2); opacity:.5; flex-shrink:0; }

  /* The website is the one item that gets emphasis — it's the destination
     everything else supports, so it's a bordered pill with a moving sheen
     rather than another line of text. */
  .mq-item.site { padding:0 30px; }
  .mq-item.site .mq-txt {
    position:relative; overflow:hidden;
    border:1px solid var(--accent); border-radius:9px; padding:7px 20px;
    background:color-mix(in srgb, var(--accent) 12%, transparent);
    color:var(--accent); letter-spacing:.09em;
    box-shadow:0 0 20px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .mq-item.site .mq-txt::after {
    content:''; position:absolute; top:0; bottom:0; width:45%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);
    animation:sheen 3.6s ease-in-out infinite;
  }
  @keyframes sheen { 0% { left:-50%; } 60%,100% { left:120%; } }

  .mq-item.code .mq-txt { color:var(--gold); }

  @media (prefers-reduced-motion:reduce) {
    .mq-track { animation-duration:0s !important; }
    .mq-item.site .mq-txt::after { animation:none; }
  }
</style>
</head>
<body>
<div class="bar" id="bar">
  <div id="slides"></div>
</div>

<script>
(function () {
  'use strict';
  var qs      = new URLSearchParams(location.search);
  var CHANNEL = (qs.get('channel') || '').toLowerCase().trim();
  var SECS    = Math.max(3, parseInt(qs.get('secs'), 10) || 8);
  var ROWS    = Math.max(1, Math.min(parseInt(qs.get('rows'), 10) || 3, 10));
  var ONLY    = (qs.get('slides') || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  var LAYOUT  = (qs.get('layout') || 'bar').toLowerCase();
  var SPEED   = Math.max(10, parseInt(qs.get('speed'), 10) || 0); // seconds per full loop; 0 = auto
  var PPS     = Math.max(4, parseInt(qs.get('pps'), 10) || 0);    // pixels per second; overrides speed
  var mqRaf   = null;
  if (LAYOUT === 'transparent') document.body.classList.add('transparent');
  if (LAYOUT === 'marquee')     document.body.classList.add('marquee');
  // Browser-only sanity check: OBS renders a browser source over transparency,
  // but a normal tab renders it over white, which makes the transparent layout
  // look broken when it isn't. ?preview=1 paints a mock scene behind it.
  if (qs.get('preview')) document.body.classList.add('preview');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function money(n, dp) {
    return '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0 });
  }

  if (qs.get('accent')) document.documentElement.style.setProperty('--accent', '#' + qs.get('accent').replace('#', ''));
  if (qs.get('bg'))     document.documentElement.style.setProperty('--bar',    '#' + qs.get('bg').replace('#', ''));

  var deck = [], idx = 0, timer = null, data = null;

  // Build the slide deck from whatever the channel actually has. A slide with
  // no data simply isn't added, so the rotation never shows an empty frame.
  function buildDeck(s) {
    var out    = [];
    var portal = s.portal || {};
    var hero   = portal.hero || {};
    var banner = (portal.content && portal.content.banner) || {};
    var code   = hero.code || '';
    var lb     = s.leaderboard || {};
    var ranks  = (lb.rankings || []).map(function (r) {
      return { rank: r.rank, name: r.name || r.username, wagered: r.wagerAmount != null ? r.wagerAmount : r.wagered };
    });

    // 1. Prize pool + code.
    if (hero.prize) {
      out.push({ id: 'promo',
        kick: (hero.cadence ? hero.cadence + ' ' : '') + 'Leaderboard',
        big: hero.prize, cls: '',
        sub: (portal.prizes && portal.prizes.length ? 'Top ' + portal.prizes.length + ' wagerers split it' : 'Wager to win')
             + (code ? ' · Code <b>' + esc(code) + '</b>' : '') });
    }

    // 2. One slide per leading wagerer.
    ranks.slice(0, ROWS).forEach(function (r) {
      out.push({ id: 'leaders',
        kick: 'Wager Leaderboard',
        big: money(r.wagered), cls: '',
        sub: '#' + r.rank + ' · ' + esc(String(r.name).toUpperCase()) });
    });

    // 3. Time left in the race.
    var t = s.leaderboardTimer;
    if (t && t.active && t.endAt && t.endAt > Date.now()) {
      out.push({ id: 'countdown', kick: 'Race ends in', big: '', cls: 'plain',
        sub: code ? 'Play under code <b>' + esc(code) + '</b>' : 'Get your wager in', live: t.endAt });
    }

    // 4. Raffle mechanic, if the portal describes one.
    var raf = (portal.content && portal.content.raffles) || null;
    if (raf && raf.blurb) {
      out.push({ id: 'raffle',
        kick: raf.headline || 'Weekly Raffle', big: raf.prizeShort || '', cls: 'gold',
        sub: raf.drawLine || 'Drawn live on stream' });
    }

    // 5. Anything hand-written in the preset.
    (banner.slides || []).forEach(function (sl) {
      out.push({ id: 'custom',
        kick: sl.kicker || '', big: sl.big || '', cls: sl.style || '', sub: sl.sub || '' });
    });

    // Honor ?slides= as both a filter and an ordering.
    if (ONLY.length) {
      out = ONLY.reduce(function (acc, id) {
        return acc.concat(out.filter(function (x) { return x.id === id; }));
      }, []);
    }
    return out;
  }

  // ── MARQUEE ICONS ────────────────────────────────────────────────────────
  // These are plain lettermark tiles in each platform's brand colour, NOT
  // reproductions of the official logos — trademarked marks aren't ours to
  // redraw, and an approximation always looks worse than either the real thing
  // or an honest letter.
  //
  // For the real logos, put the official asset from each platform's brand /
  // press kit in /img/ and set `iconUrl` on the item in the preset; it takes
  // priority over everything here.
  function tile(bg, fg, letter) {
    return '<svg viewBox="0 0 24 24">'
      + '<rect x="1" y="1" width="22" height="22" rx="6" fill="' + bg + '"/>'
      + '<text x="12" y="16.6" text-anchor="middle" font-family="Exo 2, Inter, sans-serif"'
      + ' font-size="14" font-weight="900" fill="' + fg + '">' + letter + '</text></svg>';
  }
  var ICONS = {
    kick:    tile('#53fc18', '#0a0a0a', 'K'),
    x:       tile('#000000', '#ffffff', 'X'),
    discord: tile('#5865F2', '#ffffff', 'D'),
    site: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">'
        + '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.7 2.6 15.3 0 18M12 3c-2.6 2.7-2.6 15.3 0 18"/></svg>',
    code: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">'
        + '<path d="M9 6l-5 6 5 6M15 6l5 6-5 6"/></svg>',
  };

  function marqueeItems(s) {
    var portal = s.portal || {};
    var hero   = portal.hero || {};
    var mq     = (portal.content && portal.content.marquee) || {};
    if (mq.items && mq.items.length) return mq.items;

    // No hand-written list — build one from what the channel already publishes.
    var soc = (s.streamer && s.streamer.socials) || {};
    var out = [];
    if (soc.kick || s.streamer.kickChannel) {
      out.push({ icon: 'kick', text: 'kick.com/' + (s.streamer.kickChannel || '') });
    }
    if (soc.discord) out.push({ icon: 'discord', text: String(soc.discord).replace(/^https?:\/\//, '') });
    if (soc.twitter) out.push({ icon: 'x', text: String(soc.twitter).replace(/^https?:\/\/(www\.)?(x|twitter)\.com\//, '@') });
    if (mq.website)  out.push({ icon: 'site', text: mq.website, kind: 'site' });
    if (hero.code)   out.push({ icon: 'code', text: 'CODE ' + hero.code, kind: 'code' });
    return out;
  }

  async function renderMarquee(s) {
    var items = marqueeItems(s);
    if (!items.length) return;

    var one = items.map(function (i) {
      var ico = i.iconUrl
        ? '<img src="' + esc(i.iconUrl) + '" alt="" style="width:100%;height:100%;object-fit:contain;">'
        : (ICONS[i.icon] || ICONS.site);
      return '<span class="mq-item ' + esc(i.kind || '') + '">'
        + '<span class="mq-ico">' + ico + '</span>'
        + '<span class="mq-txt">' + esc(i.text) + '</span>'
        + '</span><span class="mq-sep"></span>';
    }).join('');

    var el = document.getElementById('slides');

    // Measure with the real webfont applied. Measuring before Exo 2 loads gives
    // the fallback font's width, and every later frame is then offset by the
    // difference — a guaranteed drift.
    try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}

    // Lay ONE set down purely to measure it. getBoundingClientRect, not
    // scrollWidth: the former is fractional, the latter rounds to an integer,
    // and that rounding error is enough to show a skip on every wrap.
    el.innerHTML = '<div class="mq-track">' + one + '</div>';
    var setW = el.firstElementChild.getBoundingClientRect().width;
    if (!setW) return;

    // Enough copies to cover the viewport plus a spare set, so there is always
    // content queued off-screen on both sides of a wrap.
    var reps = Math.ceil(window.innerWidth / setW) + 2;
    var html = '';
    for (var i = 0; i < reps; i++) html += one;

    el.innerHTML = '<div class="mq-track">' + html + '</div>';
    var track = el.firstElementChild;

    // Pixels per second. Sits between the original 55 (too quick to read
    // comfortably) and 28 (dragged). Tune per-channel with ?pps= rather than
    // editing this — it needs no redeploy.
    var pps = PPS || (SPEED ? setW / SPEED : 38);

    // Continuous offset, wrapped modulo one set width. Because every copy is
    // identical, x and x-setW render the same picture — so the wrap is
    // invisible and the scroll genuinely never resets.
    var x = 0, last = null;
    if (mqRaf) cancelAnimationFrame(mqRaf);
    function frame(now) {
      if (last === null) last = now;
      // Clamp dt so a dropped frame or a stalled tab can't teleport the track.
      var dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      x -= pps * dt;
      if (x <= -setW) x += setW;
      track.style.transform = 'translate3d(' + x + 'px,0,0)';
      mqRaf = requestAnimationFrame(frame);
    }
    mqRaf = requestAnimationFrame(frame);
  }

  function render() {
    document.getElementById('slides').innerHTML = deck.map(function (s, i) {
      return '<div class="slide' + (i === 0 ? ' on' : '') + '" data-i="' + i + '">'
        + '<div class="mid">'
        +   (s.kick ? '<div class="kick">' + esc(s.kick) + '</div>' : '')
        +   '<div class="big ' + esc(s.cls || '') + '"' + (s.live ? ' data-live="' + s.live + '"' : '') + '>'
        +     esc(s.big) + '</div>'
        +   (s.sub ? '<div class="sub">' + s.sub + '</div>' : '')
        + '</div>'
        + '</div>';
    }).join('');
  }

  // Countdown slides tick every second while visible.
  function tickLive() {
    var el = document.querySelector('.slide.on .big[data-live]');
    if (!el) return;
    var left = Number(el.getAttribute('data-live')) - Date.now();
    if (left <= 0) { el.textContent = '00:00:00'; return; }
    var s = Math.floor(left / 1000);
    var d = Math.floor(s / 86400);
    var pad = function (n) { return String(n).padStart(2, '0'); };
    el.textContent = (d > 0 ? d + 'd ' : '')
      + pad(Math.floor(s % 86400 / 3600)) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60);
  }

  function advance() {
    var els = document.querySelectorAll('.slide');
    if (els.length < 2) return;
    els[idx].classList.remove('on');
    idx = (idx + 1) % els.length;
    els[idx].classList.add('on');
  }

  function applyTheme(s) {
    var t = (s.portal && s.portal.theme) || {};
    var set = function (k, v) { if (v) document.documentElement.style.setProperty(k, v); };
    if (!qs.get('accent')) { set('--accent', t.accent); set('--accent2', t.accent2 || t.accent); }
    set('--gold', t.gold);
    if (!qs.get('bg') && t.bg) set('--bar', t.bg);
  }

  async function load() {
    if (!CHANNEL) {
      document.getElementById('slides').innerHTML =
        '<div class="slide on"><div class="mid"><div class="kick">Rotating Banner</div>'
        + '<div class="big plain" style="font-size:26px;">Add ?channel=yourname</div></div></div>';
      return;
    }
    var s;
    try { s = await (await fetch('/api/portal-data?channel=' + encodeURIComponent(CHANNEL))).json(); }
    catch (e) { return; }
    if (!s || s.error) return;
    data = s;
    applyTheme(s);

    // The marquee scrolls a single continuous track instead of rotating a
    // deck, so it takes a different path entirely — and it must NOT be
    // re-rendered on every refresh, or the scroll would restart mid-loop.
    if (LAYOUT === 'marquee') {
      if (!window.__mqDrawn) { window.__mqDrawn = true; renderMarquee(s); }
      return;
    }

    var next = buildDeck(s);
    if (!next.length) return;
    // Keep position across refreshes when the deck is unchanged, so a 60s data
    // refresh doesn't visibly snap the rotation back to the first slide.
    var same = deck.length === next.length && JSON.stringify(deck) === JSON.stringify(next);
    deck = next;
    if (!same) { idx = 0; render(); }
  }

  load();
  setInterval(load, 60000);
  setInterval(tickLive, 1000);
  timer = setInterval(advance, SECS * 1000);
})();
